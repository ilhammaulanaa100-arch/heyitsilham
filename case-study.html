<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Case Study — Ilham</title>
  <meta name="description" content="A case study from Ilham's design portfolio — editorial, cinematic product design." />
  <meta name="author" content="Ilham" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Open Graph -->
  <meta property="og:type" content="article" />
  <meta property="og:title" content="Case Study — Ilham" />
  <meta property="og:description" content="A case study from Ilham's design portfolio." />
  <meta property="og:url" content="https://heyitsilham.vercel.app/" />
  <meta property="og:image" content="https://heyitsilham.vercel.app/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Case Study — Ilham" />
  <meta name="twitter:description" content="A case study from Ilham's design portfolio." />
  <meta name="twitter:image" content="https://heyitsilham.vercel.app/og-image.jpg" />

  <!-- Favicons -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Recoleta (brand serif, same as index.html) -->
  <link href="https://api.fontshare.com/v2/css?f[]=recoleta@300&display=swap" rel="stylesheet" />

  <!-- JetBrains Mono + Archivo + Cormorant Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/lenis@2.0.0/dist/lenis.min.js"></script>
  <link rel="stylesheet" href="case-study.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #fff;
      color: #000;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    #page-wipe {
      position: fixed; inset: 0; z-index: 100001;
      background: #fff;

      transform: translateX(100%);
      will-change: transform;
      pointer-events: none;
    }
    html.cs-anim #page-wipe { transform: translateX(0); }
    html.cs-anim #cs-right  { transform: none; visibility: hidden; }
    html.cs-anim .cs-slide[data-index="0"] .proj-card { opacity: 0; }
    html.cs-anim #cs-close  { opacity: 0; }
  </style>
</head>
<body>
  <div id="page-wipe"></div>
  <script>
    try { if (sessionStorage.getItem('cs-wipe')) document.documentElement.classList.add('cs-anim'); } catch (e) {}
  </script>

  <!-- Two-panel PDP shell -->
  <div class="cs-shell" id="cs-shell">

    <!-- LEFT: sticky slider panel -->
    <div class="cs-left" id="cs-left">
      <a class="cs-close" id="cs-close" href="index.html">← Close</a>
      <!-- Slider: image cards, captions, and navigation controls -->
      <div class="cs-slider" id="cs-slider"></div>
    </div>

    <!-- RIGHT: scrolling article panel -->
    <div class="cs-right" id="cs-right">
      <div id="cs-right-content">
        <a class="cs-source" id="cs-source" href="" target="_blank" rel="noopener noreferrer">Source ↗</a>
        <!-- Article content populated by buildDetail() -->
        <div class="cs-detail" id="cs-detail"></div>
      </div>
    </div>

  </div><!-- end .cs-shell -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="content.js"></script>
  <script src="case-study.js"></script>
  <script>
    // ── Guard against content.js failing to load ───
    if (typeof PROJECTS === 'undefined' || !PROJECTS || !PROJECTS.length) {
      console.error('content.js did not load or PROJECTS is empty');
      document.getElementById('cs-shell').style.opacity = '1';
      // nothing to render — exit early
    } else {

      // ── Resolve current project from ?p= slug ───────────
      var param  = new URLSearchParams(window.location.search).get('p');
      var p_data = CaseStudy.resolveProject(param);

      // ── Populate page metadata ───────────────────────────
      // Title fallback: subtitle → title → generic
      document.title = (p_data.subtitle || p_data.title || 'Case Study') + ' — Ilham';

      // ── Source link — checked after normalizer ────
      var sourceLink = document.getElementById('cs-source');
      if (p_data.sourceUrl && p_data.sourceUrl.trim() !== '') {
        sourceLink.href = p_data.sourceUrl;
        sourceLink.removeAttribute('hidden');
      } else {
        sourceLink.setAttribute('hidden', '');
      }

      function exitPage(href) {
        var wipe = document.getElementById('page-wipe');
        if (window.gsap && wipe) {
          gsap.set(wipe, { display: 'block', autoAlpha: 1, xPercent: 100 });
          gsap.to(wipe, { xPercent: 0, duration: 0.6, ease: 'power4.inOut',
            onComplete: function () { window.location.href = href; }
          });
        } else {
          window.location.href = href;
        }
      }

      // Close → homepage
      document.getElementById('cs-close').addEventListener('click', function(e) {
        e.preventDefault();
        exitPage('index.html');
      });

      // ── Render slider + detail via module ─────────────────
      CaseStudy.render(p_data, {
        sliderEl:      document.getElementById('cs-slider'),
        detailEl:      document.getElementById('cs-detail'),
        scrollWrapper: document.getElementById('cs-right'),
        contentEl:     document.getElementById('cs-right-content'),
        exitFn:        exitPage
      });

      // ── Entrance: panel + image glide ─────────────────────
      function runEntrance() {
        var wipe  = document.getElementById('page-wipe');
        var shell = document.getElementById('cs-shell');
        var root  = document.documentElement;
        var came = false, flip = null;
        try {
          came = !!sessionStorage.getItem('cs-wipe');
          var raw = sessionStorage.getItem('cs-flip');
          if (raw) flip = JSON.parse(raw);
          sessionStorage.removeItem('cs-wipe');
          sessionStorage.removeItem('cs-flip');
        } catch (e) {}
        function entered() { document.dispatchEvent(new Event('cs-entered')); }

        if (came && window.gsap) {
          if (shell) shell.style.opacity = '1';
          if (wipe) gsap.set(wipe, { xPercent: 0 });

          if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
            if (wipe) wipe.style.display = 'none';
            root.classList.remove('cs-anim');
            var rmCard = document.querySelector('.cs-slide[data-index="0"] .proj-card');
            if (rmCard) gsap.set(rmCard, { opacity: 1 });
            entered();
            return;
          }

          var D = 0.7;
          var card = document.querySelector('.cs-slide[data-index="0"] .proj-card');
          var t = card ? card.getBoundingClientRect() : null;

          gsap.set('#cs-right', { xPercent: 100, visibility: 'visible' });

          var slid = false;

          if (flip && flip.src && card && t && t.width > 0 && t.height > 0) {
            slid = true;
            var clone = document.createElement('div');
            clone.style.cssText = 'position:fixed;left:' + flip.x + 'px;top:' + flip.y + 'px;width:' + flip.w + 'px;height:' + flip.h + 'px;overflow:hidden;z-index:100002;pointer-events:none;opacity:1;will-change:transform;backface-visibility:hidden;';
            var ci = document.createElement('img');
            ci.src = flip.src;
            ci.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
            ci.onerror = function() { if (clone.parentNode) clone.remove(); if (card) gsap.set(card, { opacity: 1 }); root.classList.remove('cs-anim'); };
            clone.appendChild(ci);
            var dx = t.left - flip.x;
            var dy = t.top  - flip.y;
            var decoded = false;
            var safetyTimer = null;
            var afterDecode = function() {
              if (decoded) return;
              decoded = true;
              clearTimeout(safetyTimer);
              document.body.appendChild(clone);
              requestAnimationFrame(function() {
                var tl = gsap.timeline({ onComplete: function() { root.classList.remove('cs-anim'); } });
                tl.to(wipe,          { xPercent: -105, duration: D, ease: 'expo.inOut',
                                       onComplete: function() { wipe.style.display = 'none'; } }, 0)
                  .fromTo('#cs-right', { xPercent: 100, visibility: 'visible' }, { xPercent: 0, duration: D, ease: 'expo.inOut' }, 0)
                  .to(clone,           { x: dx, y: dy, width: t.width, height: t.height, duration: D, ease: 'expo.inOut' }, 0)
                  .to(card,            { opacity: 1, duration: 0.28, ease: 'power1.out' }, D * 0.62)
                  .to(clone,           { opacity: 0, duration: 0.30, ease: 'power1.out',
                                         onComplete: function() { clone.remove(); } }, D * 0.62)
                  .add(function() { entered(); }, D * 0.70)
                  .to('#cs-close',     { opacity: 0.5, duration: 0.4 }, D * 0.80);
              });
            };
            safetyTimer = setTimeout(afterDecode, 500);
            var decodePromise;
            try { decodePromise = ci.decode ? ci.decode() : Promise.reject(new Error()); }
            catch(e) { decodePromise = Promise.reject(e); }
            decodePromise.then(afterDecode, afterDecode);
          }

          if (!slid) {
            var tl = gsap.timeline({ onComplete: function() { root.classList.remove('cs-anim'); } });
            tl.to(wipe,          { xPercent: -105, duration: D, ease: 'expo.inOut',
                                   onComplete: function() { wipe.style.display = 'none'; } }, 0)
              .fromTo('#cs-right', { xPercent: 100, visibility: 'visible' }, { xPercent: 0, duration: D, ease: 'expo.inOut' }, 0)
              .add(function() { if (card) gsap.set(card, { opacity: 1 }); }, 0)
              .add(function() { entered(); }, D * 0.70)
              .to('#cs-close',     { opacity: 0.5, duration: 0.4 }, D * 0.80);
          }
        } else {
          if (shell) shell.style.opacity = '1';
          if (wipe) wipe.style.display = 'none';
          root.classList.remove('cs-anim');
          entered();
        }
      }

      // Trigger entrance after fonts load (or 800ms cap) — restores Phase-1 parity.
      (function () {
        var go = function () {
          requestAnimationFrame(function () { requestAnimationFrame(runEntrance); });
        };
        if (document.fonts && document.fonts.ready) {
          Promise.race([
            document.fonts.ready,
            new Promise(function (r) { setTimeout(r, 800); })
          ]).then(go);
        } else {
          go();
        }
      })();

    } // end PROJECTS guard
  </script>
</body>
</html>
