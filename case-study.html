<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Study — Ilham</title>

  <link href="https://api.fontshare.com/v2/css?f[]=recoleta@300&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: 'ITC Garamond Std';
      font-style: italic;
      font-weight: 300;
      src: local('ITC Garamond Std Light Narrow Italic'),
           local('ITCGaramondStd-LtNarrIt'),
           local('ITC Garamond Std Light Italic');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #fff; color: #000; -webkit-font-smoothing: antialiased; }

    .page-wrap { opacity: 0; }

    /* ── Nav ─────────────────────────────────────── */
    .cs-nav {
      position: fixed;
      inset: 0 0 auto;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 56px;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 200;
    }
    .cs-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 300;
      font-size: 17px;
      letter-spacing: -0.17px;
      color: #000;
      text-decoration: none;
      cursor: pointer;
    }
    .cs-back svg { flex-shrink: 0; transition: transform 0.25s ease; }
    .cs-back:hover svg { transform: translateX(-4px); }
    .cs-nav-num {
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 300;
      font-size: 17px;
      letter-spacing: -0.17px;
      color: #999;
    }

    /* ── Hero ────────────────────────────────────── */
    .cs-hero {
      width: 100%;
      height: 68vh;
      min-height: 440px;
      margin-top: 72px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cs-hero-bg {
      position: absolute;
      inset: 0;
      transform-origin: top center;
    }
    .cs-hero-ph {
      position: relative;
      z-index: 2;
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      user-select: none;
    }

    /* ── Scrollable body ─────────────────────────── */
    .cs-body {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 56px;
    }

    /* ── Title row ───────────────────────────────── */
    .cs-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 60px;
      padding: 72px 0 56px;
      border-bottom: 1px solid #e8e8e8;
    }
    .cs-title {
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: 88px;
      line-height: 0.98;
      letter-spacing: -1px;
      color: #000;
      flex-shrink: 0;
    }
    .cs-meta {
      display: flex;
      gap: 48px;
      padding-top: 14px;
      flex-shrink: 0;
    }
    .cs-meta-label {
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 6px;
    }
    .cs-meta-value {
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 300;
      font-size: 18px;
      letter-spacing: -0.18px;
      color: #000;
    }

    /* ── Overview ────────────────────────────────── */
    .cs-overview {
      display: flex;
      align-items: flex-start;
      gap: 80px;
      padding: 64px 0;
      border-bottom: 1px solid #e8e8e8;
    }
    .cs-overview-tag {
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #aaa;
      white-space: nowrap;
      padding-top: 8px;
      min-width: 90px;
    }
    .cs-overview-text {
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: 38px;
      line-height: 1.38;
      letter-spacing: -0.3px;
      color: #000;
    }

    /* ── Gallery ─────────────────────────────────── */
    .cs-gallery {
      padding: 80px 0;
      border-bottom: 1px solid #e8e8e8;
    }
    .cs-gallery-tag {
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 28px;
    }
    .cs-gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 14px;
    }
    .cs-gi {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 18px 22px;
    }
    .cs-gi:nth-child(1) {
      grid-column: 1 / -1;
      aspect-ratio: 16 / 7;
    }
    .cs-gi:nth-child(2),
    .cs-gi:nth-child(3) {
      aspect-ratio: 4 / 3;
    }
    .cs-gi:nth-child(4),
    .cs-gi:nth-child(5) {
      aspect-ratio: 4 / 3;
    }
    .cs-gi-label {
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      position: relative;
      z-index: 1;
    }

    /* ── Next project ────────────────────────────── */
    .cs-next {
      padding: 88px 0 110px;
    }
    .cs-next-tag {
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 18px;
    }
    .cs-next-link {
      display: inline-flex;
      align-items: center;
      gap: 28px;
      text-decoration: none;
      cursor: pointer;
    }
    .cs-next-title {
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: 76px;
      line-height: 1.0;
      letter-spacing: -0.8px;
      color: #000;
      transition: opacity 0.22s;
    }
    .cs-next-arrow {
      font-size: 52px;
      color: #000;
      line-height: 1;
      transition: transform 0.28s ease, opacity 0.22s;
    }
    .cs-next-link:hover .cs-next-title,
    .cs-next-link:hover .cs-next-arrow { opacity: 0.35; }
    .cs-next-link:hover .cs-next-arrow { transform: translateX(10px); }
  </style>
</head>
<body>
  <div class="page-wrap">

    <nav class="cs-nav">
      <a class="cs-back" id="back-btn" href="index.html">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.5 4L7 10L12.5 16" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </a>
      <span class="cs-nav-num" id="cs-num">01</span>
    </nav>

    <div class="cs-hero" id="cs-hero">
      <div class="cs-hero-bg" id="cs-hero-bg"></div>
      <span class="cs-hero-ph">Image</span>
    </div>

    <div class="cs-body">

      <div class="cs-title-row" id="cs-title-row">
        <h1 class="cs-title" id="cs-title">—</h1>
        <div class="cs-meta">
          <div>
            <p class="cs-meta-label">Role</p>
            <p class="cs-meta-value" id="cs-role">—</p>
          </div>
          <div>
            <p class="cs-meta-label">Year</p>
            <p class="cs-meta-value" id="cs-year">—</p>
          </div>
          <div>
            <p class="cs-meta-label">Type</p>
            <p class="cs-meta-value" id="cs-type">—</p>
          </div>
        </div>
      </div>

      <div class="cs-overview" id="cs-overview">
        <span class="cs-overview-tag">Overview</span>
        <p class="cs-overview-text" id="cs-desc">—</p>
      </div>

      <div class="cs-gallery" id="cs-gallery">
        <p class="cs-gallery-tag">Gallery</p>
        <div class="cs-gallery-grid" id="cs-gallery-grid"></div>
      </div>

      <div class="cs-next" id="cs-next">
        <p class="cs-next-tag">Next project</p>
        <a class="cs-next-link" id="cs-next-link" href="#">
          <span class="cs-next-title" id="cs-next-title">—</span>
          <span class="cs-next-arrow">→</span>
        </a>
      </div>

    </div>
  </div><!-- end .page-wrap -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    // ── Project data ───────────────────────────────────────
    var projects = {
      1: {
        title: 'heyitsilham',
        role: 'Design & Dev',
        year: '2025',
        type: 'Web',
        color: 'linear-gradient(160deg,#9f4bed 0%,#7b49a9 100%)',
        desc: 'An editorial portfolio driven by scroll and interaction. Designed to feel alive — each section enters with cinematic purpose, and the right-side slider leaves a visual mark in memory.',
        gallery: [
          'linear-gradient(160deg,#9f4bed,#7b49a9)',
          'linear-gradient(160deg,#c27dfc,#9f4bed)',
          'linear-gradient(160deg,#7b49a9,#4a2a6e)',
          'linear-gradient(160deg,#b060f8,#8040c8)',
          'linear-gradient(160deg,#6a3898,#3a1a58)'
        ],
        next: 2
      },
      2: {
        title: 'BYOND by BSI',
        role: 'UI / UX Design',
        year: '2025',
        type: 'Mobile',
        color: 'linear-gradient(160deg,#1c1c3e 0%,#0f0f2e 100%)',
        desc: 'A digital banking companion designed for the next generation of BSI customers. Clean, purposeful interfaces that make complex financial interactions feel effortless and human.',
        gallery: [
          'linear-gradient(160deg,#1c1c3e,#0f0f2e)',
          'linear-gradient(160deg,#2e2e5e,#1c1c3e)',
          'linear-gradient(160deg,#0f0f2e,#050518)',
          'linear-gradient(160deg,#3a3a6e,#2a2a4e)',
          'linear-gradient(160deg,#12123a,#080828)'
        ],
        next: 3
      },
      3: {
        title: 'Project 03',
        role: 'Design',
        year: '2025',
        type: 'Web',
        color: 'linear-gradient(160deg,#e05c45,#a03020)',
        desc: 'Case study coming soon. This placeholder represents an upcoming project. The full story — research, process, and outcomes — will be published here.',
        gallery: [
          'linear-gradient(160deg,#e05c45,#a03020)',
          'linear-gradient(160deg,#f07860,#c04030)',
          'linear-gradient(160deg,#a03020,#701510)',
          'linear-gradient(160deg,#d04030,#901a10)',
          'linear-gradient(160deg,#b84838,#782018)'
        ],
        next: 4
      },
      4: {
        title: 'Project 04',
        role: 'Design',
        year: '2025',
        type: 'Mobile',
        color: 'linear-gradient(160deg,#2db8a3,#1a7a6e)',
        desc: 'Case study coming soon. This placeholder represents an upcoming project. The full story — research, process, and outcomes — will be published here.',
        gallery: [
          'linear-gradient(160deg,#2db8a3,#1a7a6e)',
          'linear-gradient(160deg,#45d0ba,#2db8a3)',
          'linear-gradient(160deg,#1a7a6e,#0d4a42)',
          'linear-gradient(160deg,#38c8b0,#20906a)',
          'linear-gradient(160deg,#22a090,#125a55)'
        ],
        next: 5
      },
      5: {
        title: 'Project 05',
        role: 'Design',
        year: '2025',
        type: 'Brand',
        color: 'linear-gradient(160deg,#4b63e8,#2a3db0)',
        desc: 'Case study coming soon. This placeholder represents an upcoming project. The full story — research, process, and outcomes — will be published here.',
        gallery: [
          'linear-gradient(160deg,#4b63e8,#2a3db0)',
          'linear-gradient(160deg,#6b80f0,#4b63e8)',
          'linear-gradient(160deg,#2a3db0,#152080)',
          'linear-gradient(160deg,#5570f0,#3548c0)',
          'linear-gradient(160deg,#3a50d8,#1e2e98)'
        ],
        next: 6
      },
      6: {
        title: 'Project 06',
        role: 'Design',
        year: '2025',
        type: 'Brand',
        color: 'linear-gradient(160deg,#e8a52b,#b07815)',
        desc: 'Case study coming soon. This placeholder represents an upcoming project. The full story — research, process, and outcomes — will be published here.',
        gallery: [
          'linear-gradient(160deg,#e8a52b,#b07815)',
          'linear-gradient(160deg,#f0bc4a,#e8a52b)',
          'linear-gradient(160deg,#b07815,#7a5010)',
          'linear-gradient(160deg,#d89520,#a06810)',
          'linear-gradient(160deg,#c88820,#906010)'
        ],
        next: 1
      }
    };

    // ── Parse project param ──────────────────────────────
    var pNum = parseInt(new URLSearchParams(window.location.search).get('p')) || 1;
    if (pNum < 1 || pNum > 6) pNum = 1;
    var p = projects[pNum];

    // ── Populate content ─────────────────────────────────
    document.title = p.title + ' — Ilham';
    document.getElementById('cs-num').textContent = String(pNum).padStart(2, '0');
    document.getElementById('cs-hero-bg').style.background = p.color;
    document.getElementById('cs-title').textContent = p.title;
    document.getElementById('cs-role').textContent  = p.role;
    document.getElementById('cs-year').textContent  = p.year;
    document.getElementById('cs-type').textContent  = p.type;
    document.getElementById('cs-desc').textContent  = p.desc;

    // Gallery items (1 wide + 4 regular = 5 total, CSS grid handles layout)
    var grid = document.getElementById('cs-gallery-grid');
    p.gallery.forEach(function(color, i) {
      var item = document.createElement('div');
      item.className = 'cs-gi';
      item.style.background = color;
      var lbl = document.createElement('span');
      lbl.className = 'cs-gi-label';
      lbl.textContent = 'Image ' + String(i + 1).padStart(2, '0');
      item.appendChild(lbl);
      grid.appendChild(item);
    });

    // Next project
    var nextP = projects[p.next];
    document.getElementById('cs-next-title').textContent = nextP.title;
    document.getElementById('cs-next-link').href = 'case-study.html?p=' + p.next;

    // ── Page transitions ─────────────────────────────────
    function exitPage(href) {
      gsap.to('.page-wrap', {
        opacity: 0, duration: 0.35, ease: 'power2.in',
        onComplete: function() { window.location.href = href; }
      });
    }

    document.getElementById('back-btn').addEventListener('click', function(e) {
      e.preventDefault(); exitPage('index.html');
    });
    document.getElementById('cs-next-link').addEventListener('click', function(e) {
      e.preventDefault(); exitPage(this.getAttribute('href'));
    });

    // ── Page-in + scroll reveals ──────────────────────────
    window.addEventListener('load', function() {
      var reveals = [
        document.getElementById('cs-title-row'),
        document.getElementById('cs-overview'),
        document.getElementById('cs-gallery'),
        document.getElementById('cs-next')
      ];

      gsap.set(reveals, { opacity: 0, y: 28 });

      // Hero + nav entrance
      var tl = gsap.timeline();
      tl.to('.page-wrap', { opacity: 1, duration: 0.5, ease: 'power2.out' })
        .from('.cs-hero-bg', { scale: 1.04, duration: 1.0, ease: 'expo.out', transformOrigin: 'center center' }, 0)
        .from('.cs-nav', { y: -16, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0.15);

      // Scroll-triggered reveals via IntersectionObserver
      var obs = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (!entry.isIntersecting) return;
          gsap.to(entry.target, { opacity: 1, y: 0, duration: 0.75, ease: 'expo.out', delay: 0.05 });
          obs.unobserve(entry.target);
        });
      }, { threshold: 0.1 });

      reveals.forEach(function(el) { if (el) obs.observe(el); });
    });
  </script>
</body>
</html>
