<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ilham — Porto</title>

  <link href="https://api.fontshare.com/v2/css?f[]=recoleta@300&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: 'ITC Garamond Std';
      font-style: italic;
      font-weight: 300;
      src: local('ITC Garamond Std Light Narrow Italic'),
           local('ITCGaramondStd-LtNarrIt'),
           local('ITC Garamond Std Light Italic');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #fff; overflow: hidden; }

    .porto { position: fixed; inset: 0; overflow: hidden; background: #fff; opacity: 0; }
    .page-section { position: absolute; inset: 0; overflow: visible; }

    .section-inner {
      position: absolute;
      left: 0;
      top: 50%;
      width: 1440px;
      height: 900px;
      transform: translateY(-50%);
    }

    /* ── Background grid (Figma: Grid layers - v1, #222020 @ 80.68px) ── */
    .grid-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(to right,  rgba(34,32,32,0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34,32,32,0.06) 1px, transparent 1px);
      background-size: 80.68px 80.68px;
    }


    /* ── Ellipse overlay (Figma: elipse overlay 61:6389) ──
       Fixed vignette above all section image layers (max dynamic z:30) but
       below text layers (z:60) and persistent UI. */
    .ellipse-overlay {
      position: fixed; inset: 0; z-index: 50; pointer-events: none;
      background: radial-gradient(ellipse 80% 85% at 50% 50%,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0) 55%,
        rgba(255,255,255,0.45) 72%,
        rgba(255,255,255,0.88) 86%,
        #fff 96%);
    }

    /* ── Navbar ── */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 56px; z-index: 1000;
    }
    .logo { position: relative; width: 72px; height: 58px; flex-shrink: 0; }
    .logo img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .nav-pill {
      display: flex; align-items: center; background: #dfdfdf;
      border-radius: 999px; padding: 4px; flex-shrink: 0;
    }
    .nav-item {
      display: flex; align-items: center; justify-content: center;
      padding: 12px 24px; border-radius: 9999px;
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 20px; line-height: 1.3; letter-spacing: -0.2px;
      color: #000; cursor: pointer; white-space: nowrap; transition: background 0.18s;
    }
    .nav-item.active { background: #fff; }
    .nav-item:hover:not(.active) { background: rgba(255,255,255,0.55); }

    /* ── Hero ── */
    .hero {
      position: absolute; top: 0; left: 0; width: 1440px; height: 900px;
    }
    .hero-text {
      position: absolute; left: 56px; top: 316px; height: 270px;
      display: flex; flex-direction: column; gap: 8px; justify-content: center;
      width: 480px; padding: 8px 0; z-index: 60;
    }
    .hero-subtitle {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 20px; line-height: 1.3; letter-spacing: -0.2px; color: #000; width: 229px;
    }
    .hero-title {
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 100px; line-height: 1.1; letter-spacing: -1px; color: #000;
    }
    .line-mask {
      display: block; overflow: hidden;
      padding-block: 0.14em; margin-block: -0.14em;
    }
    .line-mask .line { display: block; white-space: nowrap; }
    .char { display: inline-block; }

    /* ── Image block (Hero) ── */
    .image-block {
      position: absolute; left: 508px; top: 239px;
      width: 424px; height: 460px;
    }
    .image-bg { position: absolute; inset: 0; background: linear-gradient(to bottom, #9f4bed, #7b49a9); }
    .image-photo {
      position: absolute; top: 77px; left: 11px;
      width: 413px; height: 383px; object-fit: cover;
    }

    /* ── Camera viewfinder brackets (from Figma 55:5795) ── */
    .viewfinder {
      position: absolute; inset: 0;
      display: inline-block;
      pointer-events: none;
    }
    .viewfinder span {
      position: absolute;
      width: 24px; height: 24px;
    }
    .vf-tl { top: -16px;    left: -16px;  border-top: 6px solid #FF3ECF;    border-left: 6px solid #FF3ECF;  border-top-left-radius: 2px; }
    .vf-tr { top: -16px;    right: -16px; border-top: 6px solid #FF3ECF;    border-right: 6px solid #FF3ECF; border-top-right-radius: 2px; }
    .vf-bl { bottom: -16px; left: -16px;  border-bottom: 6px solid #FF3ECF; border-left: 6px solid #FF3ECF;  border-bottom-left-radius: 2px; }
    .vf-br { bottom: -16px; right: -16px; border-bottom: 6px solid #FF3ECF; border-right: 6px solid #FF3ECF; border-bottom-right-radius: 2px; }

    /* ── Section navigator (right) ── */
    .section-nav {
      position: fixed; left: 1128px; top: 50%;
      transform: translateY(calc(-50% - 12px));
      width: 189px; z-index: 100; user-select: none;
    }
    .nav-inner { display: flex; flex-direction: column; gap: 24px; }
    .nav-row {
      display: flex; align-items: center; gap: 16px;
      position: relative; white-space: nowrap;
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      color: #000; line-height: 1.3;
    }
    .nav-row.is-inactive { opacity: 0.2; cursor: pointer; }
    .nav-num  { font-size: 16px; letter-spacing: -0.16px; min-width: 22px; }
    .nav-name { font-size: 24px; letter-spacing: -0.24px; }
    .nav-chevron {
      position: absolute; left: -30px; top: 50%;
      transform: translateY(-50%);
      width: 24px; height: 24px; display: none;
    }
    .nav-row.is-current .nav-chevron { display: block; }
    .nav-chevron svg { width: 100%; height: 100%; display: block; }

    /* ── Bottom bar ── */
    .bottom-location {
      position: fixed; bottom: 0; left: 0;
      display: flex; align-items: center; padding: 24px 56px; z-index: 1000;
    }
    .bottom-location p {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 16px; line-height: 1.3; letter-spacing: -0.16px; color: #000; white-space: nowrap;
    }

    /* ── BYOND section ── */
    .byond-text {
      position: absolute; left: 88px; top: 253px; z-index: 60;
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 100px; line-height: 1.1; letter-spacing: -1px; color: #000;
    }
    .byond-phone {
      position: absolute; left: 612px; top: 110px;
      width: 338px; height: 679px; background: transparent;
    }
    .byond-phone img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* ── Placeholder sections ── */
    .ph-layout {
      position: absolute; top: 181px; left: 0; width: 1440px;
      display: flex; align-items: center; gap: 74px; padding: 0 56px;
    }
    .ph-text {
      position: relative; z-index: 60;
      display: flex; flex-direction: column; gap: 8px;
      width: 480px; padding: 8px 0; flex-shrink: 0;
    }
    .ph-label {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 20px; line-height: 1.3; letter-spacing: -0.2px; color: #000; width: 229px;
    }
    .ph-title {
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 100px; line-height: 1.1; letter-spacing: -1px; color: #000;
    }
    .ph-image {
      position: relative; width: 418px; height: 437px;
      flex-shrink: 0;
      display: flex; align-items: flex-end; justify-content: flex-start; padding: 20px 24px;
    }
    .ph-image-label {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }


    /* ── Pre-GSAP hide (prevents flash before load) ── */
    .byond-text .line,
    .page-placeholder .ph-label { opacity: 0; }
  </style>
</head>
<body>

  <!-- Ellipse overlay (Figma: elipse overlay) — fixed vignette above all sections -->

  <!-- ── Persistent UI ── -->

  <div class="bottom-location">
    <p id="jakarta-time">based in Jakarta, 14:30 WIB</p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>

  <script>
    // ── Clock ──────────────────────────────────────────────
    function updateTime() {
      var t = new Intl.DateTimeFormat('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Jakarta'
      }).format(new Date());
      document.getElementById('jakarta-time').textContent = 'based in Jakarta, ' + t + ' WIB';
    }
    updateTime();
    setInterval(updateTime, 1000);

    // ── Character split for hero title ────────────────────
    function splitChars() {
      var sels = [
        '.hero-title .line',
        '.hero-subtitle',
        '.byond-text .line',
        '.ph-label',
        '.ph-title .line'
      ];
      sels.forEach(function(sel) {
        document.querySelectorAll(sel).forEach(function(el) {
          var text = el.textContent;
          el.textContent = '';
          text.split('').forEach(function(ch) {
            var s = document.createElement('span');
            s.className = 'char';
            s.textContent = ch === ' ' ? ' ' : ch;
            el.appendChild(s);
          });
        });
      });
    }
    splitChars();

    // ── Section navigator ──────────────────────────────────
    var SECTION_NAMES = [
      "Ilham's Profile", "BYOND by BSI", "Project 03",
      "Project 04", "Project 05", "Qita by BRI"
    ];
    var NAV_TOTAL = SECTION_NAMES.length;
    var navInner  = document.getElementById('nav-inner');
    var navRows   = navInner.querySelectorAll('.nav-row');

    function pad2(n) { return String(n + 1).padStart(2, '0'); }
    function fillRow(row, idx) {
      row.querySelector('.nav-num').textContent  = pad2(idx);
      row.querySelector('.nav-name').textContent = SECTION_NAMES[idx];
    }
    function updateNav(cur) {
      var prev = (cur - 1 + NAV_TOTAL) % NAV_TOTAL;
      var next = (cur + 1) % NAV_TOTAL;
      fillRow(navRows[0], prev);
      fillRow(navRows[1], cur);
      fillRow(navRows[2], next);
    }
    updateNav(0);

    // ── No-GSAP fallback ───────────────────────────────────
    function noGsapFallback() {
      document.body.style.overflow = 'auto';
      var porto = document.querySelector('.porto');
      porto.style.opacity = '1';
      porto.style.position = 'static';
      porto.style.overflow = 'visible';
      document.querySelectorAll('.page-section').forEach(function(s) {
        s.style.position = 'relative'; s.style.height = '900px';
      });
      document.querySelectorAll('.section-inner').forEach(function(s) {
        s.style.transform = 'none'; s.style.top = '0';
      });
      document.querySelectorAll(
        '.byond-text .line,.byond-phone,.page-placeholder .line,.ph-label,.ph-image'
      ).forEach(function(el) { el.style.opacity = '1'; el.style.transform = 'none'; });
    }

    // ── Main ───────────────────────────────────────────────
    window.addEventListener('load', function () {
      if (!window.gsap || !window.Observer) { noGsapFallback(); return; }
      gsap.registerPlugin(Observer);

      // ── Char group caches ──
      var heroTitle    = document.querySelectorAll('.hero-title .char');
      var heroSubtitle = document.querySelectorAll('.hero-subtitle .char');
      var byondChars   = document.querySelectorAll('.byond-text .char');
      var placeholders = document.querySelectorAll('.page-placeholder');

      // ── Initial hidden states ──
      gsap.set('.image-photo', { y: 0 });
      gsap.set('.byond-text .line', { opacity: 1 });
      gsap.set(heroTitle,    { yPercent: 0,  opacity: 1 });
      gsap.set(heroSubtitle, { yPercent: 0,  opacity: 1 });
      gsap.set(byondChars,   { yPercent: 40, opacity: 0 });
      placeholders.forEach(function(ph) {
        gsap.set(ph.querySelector('.ph-label'), { opacity: 1 });
        gsap.set(ph.querySelectorAll('.ph-label .char, .ph-title .char'), { yPercent: 40, opacity: 0 });
      });

      // ── Image click → case study ───────────────────────
      // page-section has pointer-events:none (CSS), so only the element we
      // explicitly mark 'auto' can receive clicks — preventing the topmost
      // stacked section from swallowing events meant for the active one.
      // ── Scroll Parallax System ──────────────────────
      var TOTAL    = 6;
      var current  = 0;
      var animating = false;
      var VH = window.innerHeight;

      var PEEK = 0.78;
      var EXIT = -0.8;
      var PARK = 1.5;

      var images = [ document.querySelector('.image-block'), document.querySelector('.byond-phone') ];
      document.querySelectorAll('.ph-image').forEach(function(el) { images.push(el); });

      var sections = images.map(function(el){ return el.closest('.page-section'); });

      function imgY(i, cur) {
        var fd = (i - cur + TOTAL) % TOTAL;
        if (fd === 0)         return 0;
        if (fd === 1)         return VH * PEEK;
        if (fd === TOTAL - 1) return VH * EXIT;
        return VH * PARK;
      }

      function imgZ(fd) {
        if (fd === 1)         return 30;  // next / peek — on top
        if (fd === 0)         return 20;  // active, centered
        if (fd === TOTAL - 1) return 5;   // previous, exiting — bottom
        return 10;                        // parked off-screen
      }

      images.forEach(function(el, i) {
        gsap.set(el, { y: imgY(i, 0) });
        sections[i].style.zIndex = imgZ((i - 0 + TOTAL) % TOTAL);
      });

      function sectionText(idx) {
        if (idx === 0) return { small: heroSubtitle, big: heroTitle };
        if (idx === 1) return { small: null,         big: byondChars };
        var ph = placeholders[idx - 2];
        return { small: ph.querySelectorAll('.ph-label .char'), big: ph.querySelectorAll('.ph-title .char') };
      }

      function revealText(tl, t) {
        if (t.big   && t.big.length)   tl.fromTo(t.big,   { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.7, ease: 'power3.out', stagger: { each: 0.022, from: 'start' } }, 0.25);
        if (t.small && t.small.length) tl.fromTo(t.small, { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.6, ease: 'power3.out', stagger: { each: 0.016 } }, 0.35);
      }

      function hideText(tl, t) {
        if (t.big   && t.big.length)   tl.to(t.big,   { yPercent: -40, opacity: 0, duration: 0.35, ease: 'power3.in', stagger: { each: 0.008, from: 'end' } }, 0);
        if (t.small && t.small.length) tl.to(t.small, { yPercent: -40, opacity: 0, duration: 0.3,  ease: 'power3.in' }, 0);
      }

      function go(dir) {
        if (animating) return;
        animating = true;

        var prev = current;
        current = (prev + dir + TOTAL) % TOTAL;

        images.forEach(function(el) { el.style.willChange = 'transform'; });

        var tl = gsap.timeline({
          onComplete: function() {
            animating = false;
            images.forEach(function(el) { el.style.willChange = 'auto'; });
          }
        });

        images.forEach(function(el, i) {
          var fdNew = (i - current + TOTAL) % TOTAL;
          var fdOld = (i - prev    + TOTAL) % TOTAL;
          sections[i].style.zIndex = imgZ(fdNew);
          if (fdNew === 0 || fdNew === 1 || fdOld === 0 || fdOld === 1) {
            tl.to(el, { y: imgY(i, current), duration: 1.1, ease: 'expo.inOut' }, 0);
          } else {
            gsap.set(el, { y: imgY(i, current) });
          }
        });

        // Text reveal / exit
        if (prev !== current) hideText(tl, sectionText(prev));
        revealText(tl, sectionText(current));

        // Nav update
        tl.to(navInner, {
          opacity: 0, y: dir > 0 ? -10 : 10, duration: 0.16, ease: 'power2.in',
          onComplete: function() {
            updateNav(current);
            gsap.set(navInner, { y: dir > 0 ? 10 : -10 });
          }
        }, 0.08)
        .to(navInner, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.3);
      }

      Observer.create({
        type: 'wheel,touch',
        onDown: function() { go(1);  },
        onUp:   function() { go(-1); },
        tolerance: 10,
        preventDefault: true
      });

      window.addEventListener('resize', function() {
        VH = window.innerHeight;
        images.forEach(function(el, i) { gsap.set(el, { y: imgY(i, current) }); });
      });

      window.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { go(1);  e.preventDefault(); }
        else if (e.key === 'ArrowUp'   || e.key === 'PageUp')               { go(-1); e.preventDefault(); }
      });

      navRows[0].addEventListener('click', function() { if (!animating) go(-1); });
      navRows[2].addEventListener('click', function() { if (!animating) go(1);  });

      gsap.to('.porto', { opacity: 1, duration: 0.45, ease: 'power2.out' });
    });
  </script>
</body>
</html>
