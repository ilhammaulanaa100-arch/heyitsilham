<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ilham — Porto</title>

  <link href="https://api.fontshare.com/v2/css?f[]=recoleta@300&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: 'ITC Garamond Std';
      font-style: italic;
      font-weight: 300;
      src: local('ITC Garamond Std Light Narrow Italic'),
           local('ITCGaramondStd-LtNarrIt'),
           local('ITC Garamond Std Light Italic');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #fff; overflow: hidden; }

    .porto { position: fixed; inset: 0; overflow: hidden; background: #fff; }
    .page-section { position: absolute; inset: 0; pointer-events: none; }

    .section-inner {
      position: absolute;
      left: 0;
      top: 50%;
      width: 1440px;
      height: 900px;
      transform: translateY(-50%);
    }

    /* ── Background grid (Figma: Grid layers - v1, #222020 @ 80.68px) ── */
    .grid-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(to right,  rgba(34,32,32,0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34,32,32,0.06) 1px, transparent 1px);
      background-size: 80.68px 80.68px;
    }

    /* ── Neighbouring section previews (hero first fold) ── */
    .hero-peek { position: absolute; z-index: 2; will-change: transform, opacity; }
    .hero-peek-top {
      left: 523px; top: -285px; width: 406px; height: 460px;
      background: #732323;
    }
    .hero-peek-bottom {
      left: 551px; top: 763px; width: 338px; height: 679px;
    }
    .hero-peek-bottom img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* ── Navbar ── */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 56px; backdrop-filter: blur(6px); z-index: 1000;
    }
    .logo { position: relative; width: 72px; height: 58px; flex-shrink: 0; }
    .logo img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .nav-pill {
      display: flex; align-items: center; background: #dfdfdf;
      border-radius: 999px; padding: 4px; flex-shrink: 0;
    }
    .nav-item {
      display: flex; align-items: center; justify-content: center;
      padding: 12px 24px; border-radius: 9999px;
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 20px; line-height: 1.3; letter-spacing: -0.2px;
      color: #000; cursor: pointer; white-space: nowrap; transition: background 0.18s;
    }
    .nav-item.active { background: #fff; }
    .nav-item:hover:not(.active) { background: rgba(255,255,255,0.55); }

    /* ── Hero ── */
    .hero {
      position: absolute; top: 0; left: 0; width: 1440px; height: 900px;
    }
    .hero-text {
      position: absolute; left: 56px; top: 316px; height: 270px;
      display: flex; flex-direction: column; gap: 8px; justify-content: center;
      width: 480px; padding: 8px 0;
    }
    .hero-subtitle {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 20px; line-height: 1.3; letter-spacing: -0.2px; color: #000; width: 229px;
    }
    .hero-title {
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 100px; line-height: 1.1; letter-spacing: -1px; color: #000;
    }
    .line-mask {
      display: block; overflow: hidden;
      padding-block: 0.14em; margin-block: -0.14em;
    }
    .line-mask .line { display: block; white-space: nowrap; will-change: transform; }
    .char { display: inline-block; will-change: transform, opacity; }

    /* ── Image block (Hero) ── */
    .image-block {
      position: absolute; left: 508px; top: 239px;
      width: 424px; height: 460px;
      will-change: transform;
    }
    .image-bg { position: absolute; inset: 0; background: linear-gradient(to bottom, #9f4bed, #7b49a9); }
    .image-photo {
      position: absolute; top: 77px; left: 11px;
      width: 413px; height: 383px; object-fit: cover;
    }
    .image-mask {
      position: absolute; inset: 0; background: #fff;
      opacity: 0; pointer-events: none;
    }

    /* ── Camera viewfinder brackets (from Figma 55:5795) ── */
    .viewfinder {
      position: absolute; inset: 0;
      display: inline-block;
      pointer-events: none;
    }
    .viewfinder span {
      position: absolute;
      width: 24px; height: 24px;
    }
    .vf-tl { top: -16px;    left: -16px;  border-top: 6px solid #FF3ECF;    border-left: 6px solid #FF3ECF;  border-top-left-radius: 2px; }
    .vf-tr { top: -16px;    right: -16px; border-top: 6px solid #FF3ECF;    border-right: 6px solid #FF3ECF; border-top-right-radius: 2px; }
    .vf-bl { bottom: -16px; left: -16px;  border-bottom: 6px solid #FF3ECF; border-left: 6px solid #FF3ECF;  border-bottom-left-radius: 2px; }
    .vf-br { bottom: -16px; right: -16px; border-bottom: 6px solid #FF3ECF; border-right: 6px solid #FF3ECF; border-bottom-right-radius: 2px; }

    /* ── Section navigator (right) ── */
    .section-nav {
      position: fixed; left: 1128px; top: 50%;
      transform: translateY(calc(-50% - 12px));
      width: 189px; z-index: 100; user-select: none;
    }
    .nav-inner { display: flex; flex-direction: column; gap: 24px; will-change: transform, opacity; }
    .nav-row {
      display: flex; align-items: center; gap: 16px;
      position: relative; white-space: nowrap;
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      color: #000; line-height: 1.3;
    }
    .nav-row.is-inactive { opacity: 0.2; cursor: pointer; }
    .nav-num  { font-size: 16px; letter-spacing: -0.16px; min-width: 22px; }
    .nav-name { font-size: 24px; letter-spacing: -0.24px; }
    .nav-chevron {
      position: absolute; left: -30px; top: 50%;
      transform: translateY(-50%);
      width: 24px; height: 24px; display: none;
    }
    .nav-row.is-current .nav-chevron { display: block; }
    .nav-chevron svg { width: 100%; height: 100%; display: block; }

    /* ── Bottom bar ── */
    .bottom-location {
      position: fixed; bottom: 0; left: 0;
      display: flex; align-items: center; padding: 24px 56px; z-index: 1000;
    }
    .bottom-location p {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 16px; line-height: 1.3; letter-spacing: -0.16px; color: #000; white-space: nowrap;
    }

    /* ── BYOND section ── */
    .byond-text {
      position: absolute; left: 88px; top: 253px;
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 100px; line-height: 1.1; letter-spacing: -1px; color: #000;
    }
    .byond-phone {
      position: absolute; left: 612px; top: 110px;
      width: 338px; height: 679px; will-change: transform; background: transparent;
    }
    .byond-phone img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* ── Placeholder sections ── */
    .ph-layout {
      position: absolute; top: 181px; left: 0; width: 1440px;
      display: flex; align-items: center; gap: 74px; padding: 0 56px;
    }
    .ph-text {
      display: flex; flex-direction: column; gap: 8px;
      width: 480px; padding: 8px 0; flex-shrink: 0;
    }
    .ph-label {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 20px; line-height: 1.3; letter-spacing: -0.2px; color: #000; width: 229px;
    }
    .ph-title {
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 100px; line-height: 1.1; letter-spacing: -1px; color: #000;
    }
    .ph-image {
      position: relative; width: 418px; height: 437px;
      flex-shrink: 0; will-change: transform;
      display: flex; align-items: flex-end; justify-content: flex-start; padding: 20px 24px;
    }
    .ph-image-label {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    /* ── Pre-GSAP hide (prevents flash before load) ── */
    .byond-text .line,
    .byond-phone,
    .page-placeholder .line,
    .page-placeholder .ph-label,
    .page-placeholder .ph-image { opacity: 0; }
  </style>
</head>
<body>
  <div class="porto">

  <!-- Background grid (Figma: Grid layers - v1) -->
  <div class="grid-bg"></div>

  <!-- Section 1: heyitsilham -->
  <div class="page-section page-hero">
    <div class="section-inner">
      <section class="hero">
        <div class="hero-text">
          <p class="hero-subtitle" id="hero-subtitle">Welcome to my house.</p>
          <div class="hero-title">
            <span class="line-mask"><span class="line">Heyy,</span></span>
            <span class="line-mask"><span class="line">its Ilham</span></span>
          </div>
        </div>
        <div class="image-block">
          <div class="image-bg"></div>

            src="assets/images/image-placeholder.png"

          <div class="viewfinder">
            <span class="vf-tl"></span>
            <span class="vf-tr"></span>
            <span class="vf-bl"></span>
            <span class="vf-br"></span>

          <div class="image-mask"></div>

    <div class="section-inner">
      <div class="byond-text">

        <span class="line-mask"><span class="line">by BSI</span></span>

  <!-- Section 3: Placeholder 03 -->

    <div class="section-inner">
      <section class="ph-layout">
        <div class="ph-text">
          <p class="ph-label">Placeholder</p>
          <div class="ph-title">
            <span class="line-mask"><span class="line">Project</span></span>
            <span class="line-mask"><span class="line">03.</span></span>

        <div class="ph-image" style="background: linear-gradient(160deg,#e05c45,#a03020);">

  <!-- Section 4: Placeholder 04 -->
  <div class="page-section page-placeholder">
    <div class="section-inner">
      <section class="ph-layout">
        <div class="ph-text">
          <p class="ph-label">Placeholder</p>
          <div class="ph-title">
            <span class="line-mask"><span class="line">Project</span></span>
            <span class="line-mask"><span class="line">04.</span></span>
          </div>

        <div class="ph-image" style="background: linear-gradient(160deg,#2db8a3,#1a7a6e);">

          <p class="ph-label">Placeholder</p>
          <div class="ph-title">
            <span class="line-mask"><span class="line">Project</span></span>
            <span class="line-mask"><span class="line">05.</span></span>
          </div>
        </div>
        <div class="ph-image" style="background: linear-gradient(160deg,#4b63e8,#2a3db0);">
          <span class="ph-image-label">Image</span>
        </div>
      </section>
    </div>
  </div>

  <!-- Section 6: Placeholder 06 -->
  <div class="page-section page-placeholder">
    <div class="section-inner">
      <section class="ph-layout">
        <div class="ph-text">
          <p class="ph-label">Placeholder</p>
          <div class="ph-title">

            <span class="line-mask"><span class="line">06.</span></span>
          </div>
        </div>
        <div class="ph-image" style="background: linear-gradient(160deg,#e8a52b,#b07815);">
          <span class="ph-image-label">Image</span>
        </div>

  <!-- ── Persistent UI ── -->
  <nav class="navbar">
    <div class="logo">
      <img src="assets/images/Am_LOGO.png" alt="Ilham logo" />
    </div>
    <div class="nav-pill">
      <div class="nav-item active">Work</div>
      <div class="nav-item">About</div>
      <div class="nav-item">Contact</div>
    </div>
  </nav>

  <div class="section-nav" id="section-nav">
    <div class="nav-inner" id="nav-inner">
      <div class="nav-row is-inactive" data-rel="-1">
        <span class="nav-num"></span><span class="nav-name"></span>
      </div>
      <div class="nav-row is-current">
        <span class="nav-chevron">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 7l5 5-5 5M12 7l5 5-5 5" stroke="#000" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="nav-num"></span><span class="nav-name"></span>
      </div>
      <div class="nav-row is-inactive" data-rel="1">
        <span class="nav-num"></span><span class="nav-name"></span>

  </div>


  <div class="bottom-location">
    <p id="jakarta-time">based in Jakarta, 14:30 WIB</p>
  </div>

  </div><!-- end .porto -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>

  <script>
    // ── Clock ──────────────────────────────────────────────
    function updateTime() {
      var t = new Intl.DateTimeFormat('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Jakarta'
      }).format(new Date());
      document.getElementById('jakarta-time').textContent = 'based in Jakarta, ' + t + ' WIB';
    }
    updateTime();
    setInterval(updateTime, 1000);

    // ── Character split for hero title ────────────────────
    function splitChars() {
      var sels = [
        '.hero-title .line',
        '.hero-subtitle',
        '.byond-text .line',
        '.ph-label',
        '.ph-title .line'
      ];
      sels.forEach(function(sel) {
        document.querySelectorAll(sel).forEach(function(el) {
          var text = el.textContent;
          el.textContent = '';
          text.split('').forEach(function(ch) {
            var s = document.createElement('span');
            s.className = 'char';
            s.textContent = ch === ' ' ? ' ' : ch;
            el.appendChild(s);
          });
        });
      });
    }
    splitChars();

    // ── Section navigator ──────────────────────────────────
    var SECTION_NAMES = [
      "Ilham's Profile", "BYOND by BSI", "Project 03",
      "Project 04", "Project 05", "Qita by BRI"
    ];
    var NAV_TOTAL = SECTION_NAMES.length;
    var navInner  = document.getElementById('nav-inner');
    var navRows   = navInner.querySelectorAll('.nav-row');

    function pad2(n) { return String(n + 1).padStart(2, '0'); }
    function fillRow(row, idx) {
      row.querySelector('.nav-num').textContent  = pad2(idx);
      row.querySelector('.nav-name').textContent = SECTION_NAMES[idx];
    }
    function updateNav(cur) {
      var prev = (cur - 1 + NAV_TOTAL) % NAV_TOTAL;
      var next = (cur + 1) % NAV_TOTAL;
      fillRow(navRows[0], prev);
      fillRow(navRows[1], cur);
      fillRow(navRows[2], next);
    }
    updateNav(0);

    // ── No-GSAP fallback ───────────────────────────────────
    function noGsapFallback() {
      document.body.style.overflow = 'auto';
      var porto = document.querySelector('.porto');
      porto.style.position = 'static';
      porto.style.overflow = 'visible';
      document.querySelectorAll('.page-section').forEach(function(s) {
        s.style.position = 'relative'; s.style.height = '900px';
      });
      document.querySelectorAll('.section-inner').forEach(function(s) {
        s.style.transform = 'none'; s.style.top = '0';
      });
      document.querySelectorAll(
        '.byond-text .line,.byond-phone,.page-placeholder .line,.ph-label,.ph-image'
      ).forEach(function(el) { el.style.opacity = '1'; el.style.transform = 'none'; });
    }

    // ── Main ───────────────────────────────────────────────
    window.addEventListener('load', function () {
      if (!window.gsap || !window.Observer) { noGsapFallback(); return; }
      gsap.registerPlugin(Observer);

      var VH       = window.innerHeight;
      var TOTAL    = 6;
      var current  = 0;
      var animating = false;

      // ── Initial hidden states ──
      gsap.set('.byond-phone',      { y: 160, scale: 0.9, opacity: 0 });
      gsap.set('.byond-text .char', { yPercent: 120, opacity: 0 });
      gsap.set('.image-block',      { transformOrigin: '50% 50%' });

      var placeholders = document.querySelectorAll('.page-placeholder');
      placeholders.forEach(function(ph) {
        gsap.set(ph.querySelectorAll('.ph-label, .ph-title .line'), { opacity: 1 });
        gsap.set(ph.querySelectorAll('.ph-label .char, .ph-title .char'), { opacity: 0, yPercent: 110 });
        gsap.set(ph.querySelector('.ph-image'), { opacity: 0, y: 60, scale: 0.95 });
      });

      // ── Per-section exit / enter ───────────────────────
      function heroExit(tl, at, up) {
        var d = up ? -1 : 1;
        tl.to('.hero-title .char',    { yPercent: 45*d, opacity: 0, duration: 0.45, ease: 'power3.in', stagger: { each: 0.012, ease: 'power1.in', from: 'end' } }, at)
          .to('.hero-subtitle .char', { yPercent: 45*d, opacity: 0, duration: 0.4, ease: 'power3.in', stagger: { each: 0.01, ease: 'power1.in', from: 'end' } }, at)
          .to('.image-block',         { y: 280*d, opacity: 0, duration: 0.5, ease: 'expo.in' }, at)
          .to('.hero-peek',           { y: 120*d, opacity: 0, duration: 0.5, ease: 'expo.in' }, at)
          .to('.image-mask',          { opacity: 1, duration: 0.55, ease: 'power2.in' }, at);
      }
      function heroEnter(tl, at, fromBelow) {
        var d = fromBelow ? 1 : -1;
        gsap.set('.hero-title .char',    { yPercent: 55*d, opacity: 0 });
        gsap.set('.hero-subtitle .char', { yPercent: 55*d, opacity: 0 });
        gsap.set('.image-block',         { y: 80*d, opacity: 0 });
        gsap.set('.hero-peek',           { y: 60*d, opacity: 0 });
        gsap.set('.image-mask',          { opacity: 0 });
        tl.to('.image-block',         { y: 0, opacity: 1, duration: 0.9, ease: 'expo.out' }, at)
          .to('.hero-peek',           { y: 0, opacity: 1, duration: 0.9, ease: 'expo.out' }, at + 0.05)
          .to('.hero-title .char',    { yPercent: 0, opacity: 1, duration: 0.85, ease: 'power3.out', stagger: { each: 0.028, ease: 'power1.inOut' } }, at + 0.08)
          .to('.hero-subtitle .char', { yPercent: 0, opacity: 1, duration: 0.7, ease: 'power3.out', stagger: { each: 0.022, ease: 'power1.inOut' } }, at + 0.18);
      }

      function byondExit(tl, at, up) {
        var d = up ? -1 : 1;
        tl.to('.byond-phone',      { y: 160*d, scale: 0.9, opacity: 0, duration: 0.65, ease: 'expo.in' }, at)
          .to('.byond-text .char', { yPercent: 110*d, opacity: 0, duration: 0.45, ease: 'power3.in', stagger: { each: 0.01, ease: 'power1.in', from: 'end' } }, at);
      }
      function byondEnter(tl, at, fromBelow) {
        var d = fromBelow ? 1 : -1;
        gsap.set('.byond-phone',      { y: 160*d, scale: 0.9, opacity: 0 });
        gsap.set('.byond-text .line', { opacity: 1 });
        gsap.set('.byond-text .char', { yPercent: 110*d, opacity: 0 });
        tl.to('.byond-phone',      { y: 0, scale: 1, opacity: 1, duration: 0.95, ease: 'expo.out' }, at + 0.15)
          .to('.byond-text .char', { yPercent: 0, opacity: 1, duration: 0.85, ease: 'power3.out', stagger: { each: 0.018, ease: 'power1.inOut' } }, at + 0.3);
      }

      function phExit(ph, tl, at, up) {
        var d = up ? -1 : 1;
        tl.to(ph.querySelectorAll('.ph-label .char, .ph-title .char'),
              { yPercent: 110*d, opacity: 0, duration: 0.4, ease: 'power3.in', stagger: { each: 0.01, ease: 'power1.in', from: 'end' } }, at)
          .to(ph.querySelector('.ph-image'),
              { y: 60*d, scale: 0.88, opacity: 0, duration: 0.55, ease: 'expo.in' }, at);
      }
      function phEnter(ph, tl, at, fromBelow) {
        var d = fromBelow ? 1 : -1;
        gsap.set(ph.querySelectorAll('.ph-label, .ph-title .line'),      { opacity: 1 });
        gsap.set(ph.querySelectorAll('.ph-label .char, .ph-title .char'), { yPercent: 110*d, opacity: 0 });
        gsap.set(ph.querySelector('.ph-image'),                           { y: 60*d, scale: 0.95, opacity: 0 });
        tl.to(ph.querySelector('.ph-image'),
              { y: 0, scale: 1, opacity: 1, duration: 0.85, ease: 'expo.out' }, at)
          .to(ph.querySelectorAll('.ph-label .char, .ph-title .char'),
              { yPercent: 0, opacity: 1, duration: 0.7, ease: 'power3.out', stagger: { each: 0.018, ease: 'power1.inOut' } }, at + 0.1);
      }

      function doExit(idx, tl, at, forward) {
        if (idx === 0)      heroExit(tl, at, forward);
        else if (idx === 1) byondExit(tl, at, forward);
        else                phExit(placeholders[idx - 2], tl, at, forward);
      }
      function doEnter(idx, tl, at, forward) {
        if (idx === 0)      heroEnter(tl, at, forward);
        else if (idx === 1) byondEnter(tl, at, forward);
        else                phEnter(placeholders[idx - 2], tl, at, forward);
      }

      // ── Navigation ────────────────────────────────────
      function go(dir) {
        if (animating) return;
        animating = true;
        var prev    = current;
        current     = (current + dir + TOTAL) % TOTAL;
        var forward = dir > 0;

        var tl = gsap.timeline({ onComplete: function () { animating = false; syncClickable(); } });
        doExit(prev, tl, 0, forward);
        doEnter(current, tl, 0.55, forward);

        // Section navigator slides in the new prev/current/next window
        tl.to(navInner, {
              opacity: 0, y: forward ? -10 : 10, duration: 0.16, ease: 'power2.in',
              onComplete: function () {
                updateNav(current);
                gsap.set(navInner, { y: forward ? 10 : -10 });
              }
            }, 0.08)
          .to(navInner, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.3);
      }

      Observer.create({
        type: 'wheel,touch',
        onDown: function () { go(1);  },
        onUp:   function () { go(-1); },
        tolerance: 10,
        preventDefault: true
      });

      window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { go(1);  e.preventDefault(); }
        else if (e.key === 'ArrowUp' || e.key === 'PageUp')                 { go(-1); e.preventDefault(); }
      });

      // ── Navigator rows are clickable — prev/next jump a section ─
      navRows[0].addEventListener('click', function () { if (!animating) go(-1); });
      navRows[2].addEventListener('click', function () { if (!animating) go(1);  });

      // ── Image click → case study ───────────────────────
      // page-section has pointer-events:none (CSS), so only the element we
      // explicitly mark 'auto' can receive clicks — preventing the topmost
      // stacked section from swallowing events meant for the active one.
      var imgEls = [
        document.querySelector('.image-block'),
        document.querySelector('.byond-phone')
      ];
      placeholders.forEach(function(ph) {
        imgEls.push(ph ? ph.querySelector('.ph-image') : null);
      });

      var syncClickable = function() {
        imgEls.forEach(function(el, idx) {
          if (!el) return;
          var on = (idx === current);
          el.style.pointerEvents = on ? 'auto' : 'none';
          el.style.cursor        = on ? 'pointer' : 'default';
        });
      };
      syncClickable();

      imgEls.forEach(function(el, idx) {
        if (!el) return;
        el.addEventListener('click', function() {
          if (animating) return;
          gsap.to('.porto', {
            opacity: 0, duration: 0.35, ease: 'power2.in',
            onComplete: function() {
              window.location.href = 'case-study.html?p=' + (idx + 1);
            }
          });
        });
      });

      // Page fade-in on entry
      gsap.from('.porto', { opacity: 0, duration: 0.45, ease: 'power2.out' });
    });
  </script>
</body>
</html>
