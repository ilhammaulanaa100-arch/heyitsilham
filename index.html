<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ilham — Porto</title>

  <!-- Recoleta (Fontshare) -->
  <link href="https://api.fontshare.com/v2/css?f[]=recoleta@300&display=swap" rel="stylesheet" />
  <!-- Cormorant Garamond — fallback for ITC Garamond Std -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />

  <style>
    /* ITC Garamond Std — loaded from system if installed, otherwise falls back to Cormorant Garamond */
    @font-face {
      font-family: 'ITC Garamond Std';
      font-style: italic;
      font-weight: 300;
      src: local('ITC Garamond Std Light Narrow Italic'),
           local('ITCGaramondStd-LtNarrIt'),
           local('ITC Garamond Std Light Italic');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    /* Pinned experience — native scroll is replaced by the Observer timeline */
    body { background: #fff; overflow: hidden; }

    /* ── Stage ───────────────────────────────────── */
    .porto {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #fff;
    }

    /* Both sections occupy the full stage and overlap; the timeline
       moves their inner elements past each other. */
    .page-section { position: absolute; inset: 0; }

    /* Centered 1440×900 design box — preserves the Figma coordinates
       while keeping content vertically centered in any viewport. */
    .section-inner {
      position: absolute;
      left: 0;
      top: 50%;
      width: 1440px;
      height: 900px;
      transform: translateY(-50%);
    }

    /* ── Soft edge overlays (stage-level) ─────────── */
    .edge-fade {
      position: fixed;
      left: 0;
      width: 100%;
      height: 180px;
      pointer-events: none;
      z-index: 50;
    }
    .edge-fade.top {
      top: 0;
      background: linear-gradient(to bottom, #fff 16%, rgba(255,255,255,0) 100%);
    }
    .edge-fade.bottom {
      bottom: 0;
      background: linear-gradient(to top, #fff 16%, rgba(255,255,255,0) 100%);
    }

    /* ── Navbar ─────────────────────────────────── */
    .navbar {
      position: fixed;
      top: 16px;
      left: 40px;
      width: 841px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }

    .logo {
      position: relative;
      width: 72px;
      height: 58px;
      flex-shrink: 0;
    }

    .logo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .nav-pill {
      display: flex;
      align-items: center;
      background: #f5f5f5;
      border-radius: 999px;
      padding: 4px;
      flex-shrink: 0;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 9999px;
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 300;
      font-size: 20px;
      line-height: 1.3;
      letter-spacing: -0.2px;
      color: #000;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.18s;
    }

    .nav-item.active { background: #fff; }
    .nav-item:hover:not(.active) { background: rgba(255,255,255,0.55); }

    /* ── Hero ───────────────────────────────────── */
    .hero {
      position: absolute;
      top: 181px;
      left: 0;
      width: 1440px;
      display: flex;
      align-items: center;
      gap: 74px;
      padding: 0 56px;
    }

    .hero-text {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 480px;
      padding: 8px 0;
      flex-shrink: 0;
    }

    .hero-subtitle {
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 300;
      font-size: 20px;
      line-height: 1.3;
      letter-spacing: -0.2px;
      color: #000;
      width: 229px;
    }

    .hero-title {
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: 100px;
      line-height: 1.1;
      letter-spacing: -1px;
      color: #000;
    }

    /* Per-line mask for the staggered slide reveal.
       Vertical padding (cancelled by margin) keeps italic ascenders /
       descenders from being clipped at rest. */
    .line-mask {
      display: block;
      overflow: hidden;
      padding-block: 0.14em;
      margin-block: -0.14em;
    }
    .line-mask .line {
      display: block;
      white-space: nowrap;
      will-change: transform;
    }

    /* ── Image block (Flynn) ────────────────────── */
    .image-block {
      position: relative;
      width: 418px;
      height: 437px;
      flex-shrink: 0;
      will-change: transform;
    }

    .image-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, #9f4bed, #7b49a9);
    }

    .image-photo {
      position: absolute;
      top: 66px;
      left: 18px;
      width: 400px;
      height: 370.558px;
      object-fit: cover;
    }

    /* White wash that dissolves the image into the background on exit */
    .image-mask {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }

    /* ── Slider area ────────────────────────────── */
    .slider-area {
      position: fixed;
      right: 0;
      top: 0;
      width: 177px;
      height: 100vh;
      z-index: 100;
    }

    .slider-svg {
      position: absolute;
      left: 81px;
      top: 0;
      width: 80px;
      height: 100vh;
      overflow: visible;
      pointer-events: none;
    }

    /* Draggable controls */
    .slider-controls {
      position: absolute;
      left: 0;
      top: 96px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .slider-controls.is-dragging { cursor: grabbing; }

    /* Number swap — a 2-line track that slides within a mask */
    .slider-number {
      height: 44px;
      overflow: hidden;
    }
    .num-track {
      display: flex;
      flex-direction: column;
      will-change: transform;
    }
    .num-track span {
      display: block;
      height: 44px;
      line-height: 44px;
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 300;
      font-size: 40px;
      letter-spacing: -0.4px;
      color: #000;
      white-space: nowrap;
    }

    /* Slider button — matches Figma exactly */
    .slider-btn {
      position: relative;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      overflow: visible;
    }

    /*
      Background image overflows container per Figma inset:
      top: -6.62%, right: -16.91%, bottom: -27.21%, left: -16.91%
    */
    .slider-btn-bg {
      position: absolute;
      top: -6.62%;
      right: -16.91%;
      bottom: -27.21%;
      left: -16.91%;
    }

    .slider-btn-bg img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Arrow icon inset: top 29.26%, right 42.5%, bottom 33.24%, left 42.5% */
    .slider-btn-icon {
      position: absolute;
      top: 29.26%;
      right: 42.5%;
      bottom: 33.24%;
      left: 42.5%;
    }

    .slider-btn-icon img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Bottom bar ─────────────────────────────── */
    .bottom-location {
      position: fixed;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      padding: 24px 56px;
      z-index: 1000;
    }

    .bottom-location p {
      font-family: 'Recoleta', Georgia, serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.3;
      letter-spacing: -0.16px;
      color: #000;
      white-space: nowrap;
    }

    /* ── BYOND section ───────────────────────────── */
    .byond-text {
      position: absolute;
      left: 88px;
      top: 253px;
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: 100px;
      line-height: 1.1;
      letter-spacing: -1px;
      color: #000;
    }

    .byond-phone {
      position: absolute;
      left: 612px;
      top: 110px;
      width: 338px;
      height: 679px;
      will-change: transform;
      background: transparent;
    }

    .byond-phone img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Hide byond content before GSAP initialises to prevent overlap flash */
    .byond-text .line { opacity: 0; }
    .byond-phone      { opacity: 0; }
  </style>
</head>
<body>
  <div class="porto">

  <!-- ── Section 1: Hero ── -->
  <div class="page-section page-hero">
    <div class="section-inner">
      <section class="hero">
        <div class="hero-text">
          <p class="hero-subtitle" id="hero-subtitle">Welcome to my house.</p>
          <div class="hero-title">
            <span class="line-mask"><span class="line">Heyy,</span></span>
            <span class="line-mask"><span class="line">its Ilham</span></span>
          </div>
        </div>
        <div class="image-block">
          <div class="image-bg"></div>
          <img
            class="image-photo"
            src="https://www.figma.com/api/mcp/asset/7a707c93-73ac-4cfd-9678-e4d28da1b16f"
            alt="Ilham"
          />
          <div class="image-mask"></div>
        </div>
      </section>
    </div>
  </div><!-- end .page-hero -->

  <!-- ── Section 2: BYOND by BSI ── -->
  <div class="page-section page-byond">
    <div class="section-inner">
      <div class="byond-text">
        <span class="line-mask"><span class="line">BYOND</span></span>
        <span class="line-mask"><span class="line">by BSI</span></span>
      </div>
      <div class="byond-phone">
        <img src="phone-byond.png" alt="BYOND by BSI app" />
      </div>
    </div>
  </div><!-- end .page-byond -->

  <!-- ── Persistent UI (above both sections) ── -->

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <img
        src="https://www.figma.com/api/mcp/asset/fe7845ab-c179-4121-a309-702bc058c496"
        alt="Ilham logo"
      />
    </div>
    <div class="nav-pill">
      <div class="nav-item active">Work</div>
      <div class="nav-item">About</div>
      <div class="nav-item">Contact</div>
    </div>
  </nav>

  <!-- Right-side slider -->
  <div class="slider-area">
    <svg id="slider-svg" class="slider-svg"
         width="80" height="100%"
         xmlns="http://www.w3.org/2000/svg">
      <path id="slider-curve" fill="none" stroke="#8AD103" stroke-width="1" />
      <g id="slider-ticks"></g>
    </svg>

    <div class="slider-controls" id="slider-controls">
      <div class="slider-number">
        <div class="num-track" id="num-track">
          <span>01</span>
          <span>02</span>
        </div>
      </div>
      <div class="slider-btn">
        <div class="slider-btn-bg">
          <img src="https://www.figma.com/api/mcp/asset/8679237d-9a76-4805-aff3-acc63f889e96" alt="" />
        </div>
        <div class="slider-btn-icon">
          <img src="https://www.figma.com/api/mcp/asset/16a7ccb9-6a38-448d-bcb9-ef965795d4aa" alt="" />
        </div>
      </div>
    </div>
  </div>

  <!-- Soft edge fades -->
  <div class="edge-fade top"></div>
  <div class="edge-fade bottom"></div>

  <!-- Footer -->
  <div class="bottom-location">
    <p id="jakarta-time">based in Jakarta, 14:30 WIB</p>
  </div>

  </div><!-- end .porto -->

  <!-- GSAP core + Observer -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>

  <script>
    // ── Real-time Jakarta clock (GMT+7) ───────────────────
    function updateTime() {
      const t = new Intl.DateTimeFormat('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Jakarta'
      }).format(new Date());
      document.getElementById('jakarta-time').textContent = 'based in Jakarta, ' + t + ' WIB';
    }
    updateTime();
    setInterval(updateTime, 1000);

    // ── Right-side slider graphics (1:1 with Figma) ───────
    const SVG_NS    = 'http://www.w3.org/2000/svg';
    const svgCurve  = document.getElementById('slider-curve');
    const ticksG    = document.getElementById('slider-ticks');
    const controlsEl = document.getElementById('slider-controls');

    const TRACK_H      = window.innerHeight || 900;
    const LINE_REST_X  = 18;     // solid line resting x (page 1362, matches Figma Line 2)
    const TICK_X       = 12;     // tick inner x at rest
    const TICK_LEN     = 12;     // tick length
    const TICK_STEP    = 8;      // vertical spacing between ticks
    const TICK_Y0      = 0.5;    // first tick y
    const TICK_PEAK    = 20;     // max rightward tick shift at the apex
    const TICK_R       = 44;     // tick bow influence half-height
    const THUMB_OFFSET = 24;     // controls' top → button center

    // Section thumb anchor positions
    const TOP_01 = 96;
    const TOP_02 = 190;

    // Build the tick column once.
    const ticks = [];
    for (var i = 0, ty0 = TICK_Y0; ty0 <= TRACK_H; i++, ty0 = TICK_Y0 + i * TICK_STEP) {
      var ln = document.createElementNS(SVG_NS, 'line');
      ln.setAttribute('y1', ty0);
      ln.setAttribute('y2', ty0);
      var isGreen = (i % 5 === 0 && i !== 0);
      ln.setAttribute('stroke', isGreen ? '#8AD103' : '#CACACA');
      ln.setAttribute('stroke-width', '1');
      ticksG.appendChild(ln);
      ticks.push({ el: ln, y: ty0 });
    }

    function bell(d, R) {
      var ad = Math.abs(d);
      if (ad >= R) return 0;
      return 0.5 * (1 + Math.cos(Math.PI * d / R));
    }

    function renderSlider(apexY) {
      var r = LINE_REST_X;
      var d = [
        'M ' + r + ' 0',
        'L ' + r + ' ' + (apexY - 39.558),
        'C ' + r + ' ' + (apexY - 24.817) + ' ' +
              (r + 16.490) + ' ' + (apexY - 14.666) + ' ' +
              (r + 17.970) + ' ' + apexY,
        'C ' + (r + 19.748) + ' ' + (apexY + 17.629) + ' ' +
               r + ' ' + (apexY + 31.525) + ' ' +
               r + ' ' + (apexY + 49.243),
        'L ' + r + ' ' + TRACK_H
      ].join(' ');
      svgCurve.setAttribute('d', d);

      for (var k = 0; k < ticks.length; k++) {
        var t = ticks[k];
        var shift = TICK_PEAK * bell(t.y - apexY, TICK_R);
        t.el.setAttribute('x1', TICK_X + shift);
        t.el.setAttribute('x2', TICK_X + TICK_LEN + shift);
      }
    }

    // Curve trails the thumb like a pulled string.
    var sliderState = { top: TOP_01 };          // driven by the timeline
    var targetApexY = TOP_01 + THUMB_OFFSET;
    var renderApexY = targetApexY;
    function animateSlider() {
      renderApexY += (targetApexY - renderApexY) * 0.18;
      if (Math.abs(targetApexY - renderApexY) < 0.05) renderApexY = targetApexY;
      renderSlider(renderApexY);
      requestAnimationFrame(animateSlider);
    }
    animateSlider();

    // ── No-GSAP fallback ──────────────────────────────────
    function noGsapFallback() {
      document.body.style.overflow = 'auto';
      var porto = document.querySelector('.porto');
      porto.style.position = 'static';
      porto.style.overflow = 'visible';
      document.querySelectorAll('.page-section').forEach(function (s) {
        s.style.position = 'relative';
        s.style.height = '900px';
      });
      document.querySelectorAll('.section-inner').forEach(function (s) {
        s.style.transform = 'none';
        s.style.top = '0';
      });
      // Reveal byond content that CSS hid pre-GSAP
      document.querySelectorAll('.byond-text .line').forEach(function (el) {
        el.style.opacity = '1';
        el.style.transform = 'none';
      });
      var phone = document.querySelector('.byond-phone');
      if (phone) { phone.style.opacity = '1'; phone.style.transform = 'none'; }
    }

    // ── GSAP Observer-driven editorial transition ─────────
    window.addEventListener('load', function () {
      if (!window.gsap || !window.Observer) { noGsapFallback(); return; }

      gsap.registerPlugin(Observer);

      var PHONE_START_Y = window.innerHeight + 220;   // fully below the fold

      // Initial (Section 02 hidden) states
      gsap.set('.byond-phone', { y: PHONE_START_Y, scale: 0.9, opacity: 0, transformOrigin: '50% 50%' });
      gsap.set('.byond-text .line', { yPercent: 120, opacity: 0 });
      gsap.set('.image-block', { transformOrigin: '50% 50%' });

      // Master timeline: Section 01 → Section 02
      var tl = gsap.timeline({
        paused: true,
        defaults: { ease: 'expo.inOut' },
        onComplete: function ()        { animating = false; },
        onReverseComplete: function () { animating = false; }
      });

      // 1 — Flynn exits upward: text first, then image chases up and dissolves.
      //     Total Flynn exit done by t≈0.7 so iPhone never collides.
      tl.to('.hero-title .line', {
            yPercent: -130, opacity: 0, duration: 0.55,
            ease: 'expo.in', stagger: 0.08
          }, 0)
        .to('.hero-subtitle', {
            y: -32, opacity: 0, duration: 0.38, ease: 'expo.in'
          }, 0)
        .to('.image-block', {
            y: -320, scale: 0.78, opacity: 0, duration: 0.65, ease: 'expo.in'
          }, 0)
        .to('.image-mask', {
            opacity: 1, duration: 0.55, ease: 'power2.in'
          }, 0)

      // 2 — iPhone enters only after Flynn has cleared the stage (offset 0.45).
      //     Rises from below viewport into exact centre, scaling up to 1.
        .to('.byond-phone', {
            y: 0, scale: 1, opacity: 1, duration: 1.05, ease: 'expo.out'
          }, 0.45)

      // 3 — BYOND copy lifts in with rapid stagger after iPhone settles
        .to('.byond-text .line', {
            yPercent: 0, opacity: 1, duration: 0.75,
            ease: 'expo.out', stagger: 0.06
          }, 0.65)

      // 4 — Side indicator: number swaps + thumb / curve glide down
        .to('#num-track', {
            yPercent: -50, duration: 0.9, ease: 'power3.inOut'
          }, 0.25)
        .to(sliderState, {
            top: TOP_02, duration: 1.1, ease: 'power3.inOut',
            onUpdate: function () {
              controlsEl.style.top = sliderState.top + 'px';
              targetApexY = sliderState.top + THUMB_OFFSET;
            }
          }, 0);

      // ── Navigation state machine ────────────────────────
      var current   = 0;     // 0 = hero, 1 = byond
      var animating = false;

      function go(dir) {
        if (animating) return;
        if (dir > 0 && current === 0) { animating = true; current = 1; tl.play(); }
        else if (dir < 0 && current === 1) { animating = true; current = 0; tl.reverse(); }
      }

      Observer.create({
        type: 'wheel,touch',
        onDown: function() { go(1); },
        onUp:   function() { go(-1); },
        tolerance: 10,
        preventDefault: true
      });

      // Keyboard support
      window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { go(1); e.preventDefault(); }
        else if (e.key === 'ArrowUp' || e.key === 'PageUp') { go(-1); e.preventDefault(); }
      });

      // Dragging the thumb also drives the section change.
      var dragStartY = null;
      controlsEl.addEventListener('pointerdown', function (e) {
        dragStartY = e.clientY;
        controlsEl.classList.add('is-dragging');
        controlsEl.setPointerCapture(e.pointerId);
      });
      controlsEl.addEventListener('pointermove', function (e) {
        if (dragStartY === null) return;
        var dy = e.clientY - dragStartY;
        if (dy > 44)       { go(1);  dragStartY = null; }
        else if (dy < -44) { go(-1); dragStartY = null; }
      });
      function endDrag() { dragStartY = null; controlsEl.classList.remove('is-dragging'); }
      controlsEl.addEventListener('pointerup', endDrag);
      controlsEl.addEventListener('pointercancel', endDrag);
    });
  </script>
</body>
</html>
