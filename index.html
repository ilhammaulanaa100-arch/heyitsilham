  <div class="home-entry-curtain" id="home-entry-curtain" aria-hidden="true"></div>
  <script>
  // The About page can prerender this document before its menu is clicked.
  // Arm on activation as well as on a normal load so both paths get the same
  // opaque first frame and reveal.
  (function () {
    var root = document.documentElement;
    var curtain = document.getElementById('home-entry-curtain');
    var armed = false;
    var released = false;

    function hasRoute() {
      try {
        return new URLSearchParams(location.search).get('from') === 'about-menu' ||
          sessionStorage.getItem('porto-home-curtain') === '1';
      } catch (e) {
        return false;
      }
    }

    function release() {
      if (released) return;
      released = true;
      curtain.getBoundingClientRect();
      requestAnimationFrame(function () {
        root.classList.add('is-home-ready');
        setTimeout(function () {
          root.classList.add('home-entry-complete');
          root.classList.remove('from-about-curtain', 'is-home-ready');
        }, 1040);
      });
    }

    function arm() {
      if (armed || (!root.classList.contains('from-about-curtain') && !hasRoute())) return;
      armed = true;
      root.classList.remove('home-entry-complete');
      root.classList.add('from-about-curtain');
      try {
        sessionStorage.removeItem('porto-home-curtain');
        if (new URLSearchParams(location.search).get('from') === 'about-menu') {
          history.replaceState(history.state, '', 'index.html');
        }
      } catch (e) {}

      if (window.__portoHomeReady) release();
      else {
        document.addEventListener('porto:home-ready', release, { once: true });
        setTimeout(release, 1400);
      }
    }

    if (document.prerendering) {
      document.addEventListener('prerenderingchange', arm, { once: true });
    } else {
      arm();
    }
    window.addEventListener('pageshow', function (event) {
      if (event.persisted && hasRoute()) {
        try { sessionStorage.removeItem('porto-skip-splash'); } catch (e) {}
        arm();
      }
    });
  })();
  </script>

  <script>
  // Start the visible loader immediately, before third-party libraries below
  // have a chance to delay page initialisation. If a logo video source is
  // supplied, progress follows its duration; the poster fallback uses 2.6 s.
  (function () {
    var completionTimer = 0;
    var state = window.__portoSplashProgress = {
      done: false,
      completing: false,
      cancelled: false,
      onDone: null,
      cancel: function () {
        this.cancelled = true;
        if (completionTimer) clearTimeout(completionTimer);
      }
    };
    if (document.documentElement.classList.contains('skip-splash')) {
      state.done = true;
      return;
    }

    var counter = document.getElementById('splash-counter');
    var video = document.getElementById('splash-logo-video');
    var media = document.querySelector('.splash-logo-media');
    var targetDuration = 2600;
    var fallbackDuration = targetDuration;
    var completionHold = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 260;
    var startedAt = performance.now();
    var lastProgress = 0;

    function syncVideoSpeed() {
      if (!video || !Number.isFinite(video.duration) || video.duration <= 0) return;
      // The encoded clip is 3.33 s. Playback rate follows the requested visual
      // duration so the material changes and the percentage remain locked.
      video.playbackRate = Math.max(0.75, Math.min(2, (video.duration - 0.08) / (targetDuration / 1000)));
    }
    if (video) {
      video.addEventListener('loadedmetadata', syncVideoSpeed, { once: true });
      if (video.readyState >= 1) syncVideoSpeed();
    }

    function setLogoSettle(progress) {
      if (!media) return;
      // Resolve the changing material reel into the teal master mark during
      // the final beat. Smoothstep keeps the crossfade free of a visible seam.
      var t = Math.max(0, Math.min(1, (progress - 88) / 10));
      t = t * t * (3 - 2 * t);
      media.style.setProperty('--splash-settle', t.toFixed(4));
    }

    function complete() {
      if (state.cancelled || state.done || state.completing) return;
      state.completing = true;
      lastProgress = 100;
      setLogoSettle(100);
      if (counter) counter.textContent = '100%';
      if (media) media.classList.add('is-complete');
      if (video) video.pause();

      completionTimer = setTimeout(function () {
        if (state.cancelled) return;
        state.done = true;
        state.completing = false;
        if (typeof state.onDone === 'function') state.onDone();
      }, completionHold);
    }

    function render(now) {
      if (state.cancelled || state.done || state.completing) return;
      var hasTimedVideo = video && Number.isFinite(video.duration) && video.duration > 0;
      var progress = hasTimedVideo
        // Finish just ahead of the encoded tail so a repeated last frame does
        // not leave the counter visibly parked at 99%.
        ? (video.currentTime / Math.max(0.1, video.duration - 0.08)) * 100
        : ((now - startedAt) / fallbackDuration) * 100;
      progress = Math.max(lastProgress, Math.max(0, Math.min(100, progress)));
      lastProgress = progress;
      if (counter) counter.textContent = Math.floor(progress) + '%';
      setLogoSettle(progress);

      if (progress >= 100 || (hasTimedVideo && video.ended)) {
        complete();
        return;
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  })();
  </script>
