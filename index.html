<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ilham — Product Designer</title>
  <meta name="description" content="Ilham — product designer crafting editorial, cinematic digital experiences. Selected work and case studies." />
  <meta name="author" content="Ilham" />
  <link rel="canonical" href="https://heyitsilham.vercel.app/" />
  <meta name="theme-color" content="#ffffff" />
  <script>try { if (localStorage.getItem('porto-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ilham — Product Designer" />
  <meta property="og:description" content="Editorial, cinematic digital experiences. Selected work and case studies." />
  <meta property="og:url" content="https://heyitsilham.vercel.app/" />
  <meta property="og:image" content="https://heyitsilham.vercel.app/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ilham — Product Designer" />
  <meta name="twitter:description" content="Editorial, cinematic digital experiences. Selected work and case studies." />
  <meta name="twitter:image" content="https://heyitsilham.vercel.app/og-image.jpg" />

  <!-- Favicons -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Fonts -->
  <link href="https://api.fontshare.com/v2/css?f[]=recoleta@300&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />

  <!-- Styles: case-study.css (overlay) first, home.css overrides after -->
  <link rel="stylesheet" href="case-study.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <div id="proj-cursor" aria-hidden="true">
    <div class="proj-cursor-inner">
      <svg data-cursor-icon="explore" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 16L16 4M16 4H7M16 4V13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg data-cursor-icon="close" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 2L14 14M14 2L2 14" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>[EXPLORE]</span>
    </div>
  </div>

  <!-- Splash Screen -->
  <div id="splash">
    <div class="splash-grid"></div>
    <div class="splash-vignette"></div>
    <div class="splash-inner">
      <div class="splash-name" id="splash-name">Ilham.</div>
      <div class="splash-bottom">
        <div class="splash-bar-track">
          <div class="splash-bar-fill" id="splash-bar"></div>
        </div>
        <div class="splash-counter" id="splash-counter">00</div>
      </div>
    </div>
  </div>

  <div class="porto">

    <!-- Scan grid: outline grid with a scanning focus frame at centre -->
    <div class="scan-grid" aria-hidden="true">
      <span class="scan-line scan-line-v1"></span>
      <span class="scan-line scan-line-v2"></span>
      <span class="scan-line scan-line-h1"></span>
      <span class="scan-line scan-line-h2"></span>
      <div class="scan-focus" id="scan-focus">
        <span class="scan-corner scan-corner-tl"></span>
        <span class="scan-corner scan-corner-tr"></span>
        <span class="scan-corner scan-corner-bl"></span>
        <span class="scan-corner scan-corner-br"></span>
      </div>
    </div>

    <!-- Sections generated from PROJECTS in content.js -->
    <div id="sections-wrap"></div>

    <div class="vignette-radial"></div>

    <!-- ── Persistent UI ── -->
    <nav class="navbar">
      <div class="logo">
        <img src="assets/images/Am_LOGO.png" alt="Ilham logo" />
      </div>
      <div class="nav-pill" id="theme-switch">
        <div class="nav-item theme-item" data-theme="light" role="button" tabindex="0">Light</div>
        <div class="nav-item theme-item" data-theme="dark" role="button" tabindex="0">Dark</div>
      </div>
    </nav>

    <div class="section-nav" id="section-nav">
      <div class="nav-inner" id="nav-inner">
        <div class="nav-row is-inactive" data-rel="-1">
          <span class="nav-num"></span><span class="nav-name"></span>
        </div>
        <div class="nav-row is-current">
          <span class="nav-chevron">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 7l5 5-5 5M12 7l5 5-5 5" stroke="#000" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="nav-num"></span><span class="nav-name"></span>
        </div>
        <div class="nav-row is-inactive" data-rel="1">
          <span class="nav-num"></span><span class="nav-name"></span>
        </div>
      </div>
    </div>

    <div class="bottom-location">
      <p id="jakarta-time">based in Jakarta, 14:30 WIB</p>
    </div>

  </div><!-- end .porto -->

  <!-- Grid view (phantom.land-style infinite curved grid, WebGL) -->
  <div id="grid-view" aria-hidden="true"></div>

  <!-- View tabs: Vertical / Grid -->
  <div class="view-tabs" id="view-tabs">
    <button type="button" class="view-tab is-active" data-view="vertical">Vertical</button>
    <button type="button" class="view-tab" data-view="grid">Grid</button>
  </div>

  <!-- Case-study overlay (SPA, in-place) -->
  <div class="cs-overlay" id="cs-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Case study">
    <div class="cs-shell" id="cs-shell">
      <div class="cs-left" id="cs-left">
        <a class="cs-close" id="cs-close" href="javascript:void(0)">← Close</a>
        <div class="cs-slider" id="cs-slider"></div>
      </div>
      <div class="cs-right" id="cs-right">
        <div id="cs-right-content">
          <a class="cs-source" id="cs-source" href="javascript:void(0)" target="_blank" rel="noopener noreferrer">Source ↗</a>
          <div class="cs-detail" id="cs-detail"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@2.0.0/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <script src="case-study.js"></script>
  <script src="content.js"></script>
  <script src="grid.js"></script>
  <script src="home.js"></script>
</body>
</html>
