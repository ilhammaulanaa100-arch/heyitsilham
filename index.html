<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ilham — Porto</title>

  <link href="https://api.fontshare.com/v2/css?f[]=recoleta@300&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="case-study.css" />

  <style>
    @font-face {
      font-family: 'ITC Garamond Std';
      font-style: italic;
      font-weight: 300;
      src: local('ITC Garamond Std Light Narrow Italic'),
           local('ITCGaramondStd-LtNarrIt'),
           local('ITC Garamond Std Light Italic');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #fff; overflow: hidden; }

    .porto { position: fixed; inset: 0; overflow: hidden; background: #fff; opacity: 0; }
    .page-section { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
    .page-section.is-active { pointer-events: auto; }
    .page-section:not(.is-active) .proj-card { pointer-events: none; }
    .page-section.is-active .proj-card { pointer-events: auto; cursor: none; }

    .section-inner {
      position: absolute;
      left: 0;
      top: 50%;
      width: 1440px;
      height: 900px;
      transform: translateY(-50%);
    }

    /* ── Background grid (Figma: Grid layers - v1, #222020 @ 80.68px) ── */
    .grid-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(to right,  rgba(34,32,32,0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34,32,32,0.06) 1px, transparent 1px);
      background-size: 80.68px 80.68px;
    }


    .vignette-radial {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 18%),
        linear-gradient(to top,    rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 18%),
        linear-gradient(to right,  rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 18%),
        linear-gradient(to left,   rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 18%);
    }

    /* ── Navbar ── */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 56px; z-index: 1000;
    }
    .logo { position: relative; width: 72px; height: 58px; flex-shrink: 0; }
    .logo img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .nav-pill {
      display: flex; align-items: center; background: #dfdfdf;
      border-radius: 999px; padding: 4px; flex-shrink: 0;
    }
    .nav-item {
      display: flex; align-items: center; justify-content: center;
      padding: 12px 24px; border-radius: 9999px;
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 20px; line-height: 1.3; letter-spacing: -0.2px;
      color: #000; cursor: pointer; white-space: nowrap; transition: background 0.18s;
    }
    .nav-item.active { background: #fff; }
    .nav-item:hover:not(.active) { background: rgba(255,255,255,0.55); }

    .line-mask {
      display: block; overflow: visible;
      padding-block: 0.14em; margin-block: -0.14em;
    }
    .line-mask .line { display: block; white-space: normal; }
    .char { display: inline-block; }
    .word { display: inline-block; white-space: nowrap; }

    /* ── Project card ── */
    .proj-card {
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .proj-card.is-landscape { width: 580px; height: 420px; }
    .proj-card.is-square    { width: 480px; height: 480px; }
    .proj-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Section navigator (right) ── */
    .section-nav {
      position: fixed; left: 1144px; top: 50%;
      transform: translateY(calc(-50% - 12px));
      width: 240px; z-index: 100; user-select: none;
    }
    .nav-inner { display: flex; flex-direction: column; gap: 24px; }
    .nav-row {
      display: flex; align-items: center; gap: 16px;
      position: relative; white-space: nowrap;
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      color: #000; line-height: 1.3;
    }
    .nav-row.is-inactive { opacity: 0.2; cursor: pointer; }
    .nav-num  { font-size: 16px; letter-spacing: -0.16px; min-width: 22px; }
    .nav-name { font-size: 24px; letter-spacing: -0.24px; }
    .nav-chevron {
      position: absolute; left: -30px; top: 50%;
      transform: translateY(-50%);
      width: 24px; height: 24px; display: none;
    }
    .nav-row.is-current .nav-chevron { display: block; }
    .nav-chevron svg { width: 100%; height: 100%; display: block; }

    /* ── Bottom bar ── */
    .bottom-location {
      position: fixed; bottom: 0; left: 0;
      display: flex; align-items: center; padding: 24px 56px; z-index: 1000;
    }
    .bottom-location p {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 16px; line-height: 1.3; letter-spacing: -0.16px; color: #000; white-space: nowrap;
    }

    /* ── Placeholder sections ── */
    .ph-layout {
      position: absolute; top: 181px; left: 0; width: 1440px;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 56px;
    }

    .ph-text {
      position: relative; z-index: 60;
      display: flex; flex-direction: column; gap: 8px;
      width: 400px; padding: 8px 0; flex-shrink: 0;
    }
    .ph-spacer { width: 240px; flex-shrink: 0; }
    .ph-label {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 20px; line-height: 1.3; letter-spacing: -0.2px; color: #000; width: 229px;
    }
    .ph-title {
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 64px; line-height: 1.1; letter-spacing: -1px; color: #000;
      white-space: normal;
      overflow-wrap: normal;
      overflow: visible;
      padding-left: 0.05em;
    }
    /* ── Pre-GSAP hide (prevents flash before load) ── */
    .page-placeholder .ph-label { opacity: 0; }

    /* ── Splash Screen ── */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .splash-grid {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(to right,  rgba(34,32,32,0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34,32,32,0.06) 1px, transparent 1px);
      background-size: 80.68px 80.68px;
    }
    .splash-vignette {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 18%),
        linear-gradient(to top,    rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 18%),
        linear-gradient(to right,  rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 18%),
        linear-gradient(to left,   rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 18%);
    }
    .splash-inner {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: center; gap: 40px;
    }
    .splash-name {
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 96px; line-height: 1.1; letter-spacing: -1px; color: #000;
      overflow: hidden; padding-block: 0.14em;
    }
    .splash-name .char {
      display: inline-block;
      opacity: 0; transform: translateY(60%);
      animation: splashCharIn 0.72s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes splashCharIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .splash-bottom {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .splash-bar-track {
      width: 200px; height: 1px; background: rgba(0,0,0,0.1);
      position: relative; overflow: hidden;
    }
    .splash-bar-fill {
      position: absolute; left: 0; top: 0; height: 100%;
      width: 0%; background: #FF3ECF;
    }
    .splash-counter {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 14px; letter-spacing: -0.14px; color: rgba(0,0,0,0.35);
    }

   #proj-cursor {
     position: fixed;
     top: 0;
     left: 0;
     width: 120px;
     height: 120px;
     border-radius: 50%;
     background: rgba(0, 0, 0, 0.6);
     backdrop-filter: blur(8px) saturate(120%);
     -webkit-backdrop-filter: blur(8px) saturate(120%);
     display: flex;
     flex-direction: column;
     align-items: center;
     justify-content: center;
     gap: 6px;
     pointer-events: none;
     z-index: 9998;
     opacity: 0;
     transform: translate(-50%, -50%) scale(0.7);
     transition: opacity 0.25s ease, transform 0.25s ease;
     will-change: transform;
   }
   #proj-cursor.is-visible {
     opacity: 1;
     transform: translate(-50%, -50%) scale(1);
   }
   #proj-cursor svg {
     display: block;
     flex-shrink: 0;
   }
   #proj-cursor span {
     font-family: 'Recoleta', Georgia, serif;
     font-weight: 300;
     font-size: 14px;
     line-height: 1;
     letter-spacing: -0.14px;
     color: #ffffff;
     white-space: nowrap;
   }

   .proj-card { perspective: 650px; }
   .proj-card img { transition: none; transform-style: preserve-3d; will-change: auto; }

  #page-wipe {
    position: fixed; inset: 0; z-index: 100000;
    background: #fff;
    transform: translateX(100%);
    will-change: transform;
    pointer-events: none;
  }

  /* Neutralise case-study.css html.lenis rule — homepage must keep html at 100% */
  html.lenis { height: 100%; }

  /* ── Case-study overlay (SPA, in-place) ── */
  .cs-overlay { position: fixed; inset: 0; z-index: 9000; background: transparent; display: none; }
  .cs-overlay.is-open { display: block; }
  #cs-right { background: #fff; }
  </style>
</head>
<body>
  <div id="page-wipe"></div>
  <div id="proj-cursor">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 16L16 4M16 4H7M16 4V13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>[EXPLORE]</span>
  </div>
  <!-- Splash Screen -->
  <div id="splash">
    <div class="splash-grid"></div>
    <div class="splash-vignette"></div>
    <div class="splash-inner">
      <div class="splash-name" id="splash-name">Ilham.</div>
      <div class="splash-bottom">
        <div class="splash-bar-track">
          <div class="splash-bar-fill" id="splash-bar"></div>
        </div>
        <div class="splash-counter" id="splash-counter">00</div>
      </div>
    </div>
  </div>

  <div class="porto">

  <!-- Background grid (Figma: Grid layers - v1) -->
  <div class="grid-bg"></div>

  <!-- Sections generated from PROJECTS in content.js -->
  <div id="sections-wrap"></div>

  <div class="vignette-radial"></div>

  <!-- ── Persistent UI ── -->
  <nav class="navbar">
    <div class="logo">
      <img src="assets/images/Am_LOGO.png" alt="Ilham logo" />
    </div>
    <div class="nav-pill">
      <div class="nav-item active">Work</div>
      <div class="nav-item">About</div>
      <div class="nav-item">Contact</div>
    </div>
  </nav>

  <div class="section-nav" id="section-nav">
    <div class="nav-inner" id="nav-inner">
      <div class="nav-row is-inactive" data-rel="-1">
        <span class="nav-num"></span><span class="nav-name"></span>
      </div>
      <div class="nav-row is-current">
        <span class="nav-chevron">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 7l5 5-5 5M12 7l5 5-5 5" stroke="#000" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="nav-num"></span><span class="nav-name"></span>
      </div>
      <div class="nav-row is-inactive" data-rel="1">
        <span class="nav-num"></span><span class="nav-name"></span>
      </div>
    </div>
  </div>


  <div class="bottom-location">
    <p id="jakarta-time">based in Jakarta, 14:30 WIB</p>
  </div>

  </div><!-- end .porto -->

  <!-- Case-study overlay (SPA, in-place) -->
  <div class="cs-overlay" id="cs-overlay" aria-hidden="true">
    <div class="cs-shell" id="cs-shell">
      <div class="cs-left" id="cs-left">
        <a class="cs-close" id="cs-close" href="#">← Close</a>
        <div class="cs-slider" id="cs-slider"></div>
      </div>
      <div class="cs-right" id="cs-right">
        <div id="cs-right-content">
          <a class="cs-source" id="cs-source" href="" target="_blank" rel="noopener noreferrer">Source ↗</a>
          <div class="cs-detail" id="cs-detail"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@2.0.0/dist/lenis.min.js"></script>
  <script src="case-study.js"></script>
  <script src="content.js"></script>

  <script>
  (function () { /* outer IIFE — enables early return on fatal errors */

    // ── Guard: abort if content.js failed / PROJECTS missing ─
    if (typeof PROJECTS === 'undefined' || !PROJECTS || !PROJECTS.length) {
      console.error('[porto] PROJECTS is undefined — content.js may have failed to load.');
      var splashEl = document.getElementById('splash');
      if (splashEl) splashEl.style.display = 'none';
      var portoEl = document.querySelector('.porto');
      if (portoEl) portoEl.style.opacity = '1';
      return;
    }

    // ── Build sections from PROJECTS ──────────────────────
    (function() {
      function esc(str) {
        return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
      var wrap = document.getElementById('sections-wrap');
      PROJECTS.forEach(function(proj, i) {
        var shape  = i < 2 ? 'is-square' : 'is-landscape';
        var imgTag = (proj.media && proj.media.hero)
          ? '<img src="' + proj.media.hero + '" alt="' + esc(proj.subtitle) + '" onerror="this.style.display=\'none\'" />'
          : '';

        wrap.insertAdjacentHTML('beforeend',
          '<div class="page-section page-placeholder" data-slug="' + proj.slug + '">' +
            '<div class="section-inner"><section class="ph-layout">' +
              '<div class="ph-text">' +
                '<p class="ph-label">' + esc(proj.subtitle) + '</p>' +
                '<div class="ph-title">' +
                  '<span class="line-mask"><span class="line">' + esc(proj.title) + '</span></span>' +
                '</div>' +
              '</div>' +
              '<div class="proj-card ' + shape + '" style="background:' + proj.color + ';">' +
                imgTag +
              '</div>' +
              '<div class="ph-spacer"></div>' +
            '</section></div>' +
          '</div>'
        );
      });
    })();

    // ── Clock ──────────────────────────────────────────────
    function updateTime() {
      var t = new Intl.DateTimeFormat('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Jakarta'
      }).format(new Date());
      document.getElementById('jakarta-time').textContent = 'based in Jakarta, ' + t + ' WIB';
    }
    updateTime();
    setInterval(updateTime, 1000);

    // ── Character split for hero title ────────────────────
    function splitChars() {
      var sels = [
        '.ph-label',
        '.ph-title .line'
      ];
      sels.forEach(function(sel) {
        document.querySelectorAll(sel).forEach(function(el) {
          var text = el.textContent;
          el.textContent = '';
          text.split(/(\s+)/).forEach(function(token) {
            if (token === '') return;
            if (/^\s+$/.test(token)) { el.appendChild(document.createTextNode(' ')); return; }
            var word = document.createElement('span');
            word.className = 'word';
            token.split('').forEach(function(ch) {
              var s = document.createElement('span');
              s.className = 'char';
              s.textContent = ch;
              word.appendChild(s);
            });
            el.appendChild(word);
          });
        });
      });
    }
    splitChars();

    // ── Splash name: char split with CSS stagger ──────────
    (function() {
      var el = document.getElementById('splash-name');
      if (!el) return;
      var text = el.textContent;
      el.textContent = '';
      text.split('').forEach(function(ch, i) {
        var s = document.createElement('span');
        s.className = 'char';
        s.textContent = ch === ' ' ? ' ' : ch;
        s.style.animationDelay = (0.1 + i * 0.065) + 's';
        el.appendChild(s);
      });
    })();

    // ── Splash counter & progress bar ─────────────────────
    var splashProgress    = 0;
    var splashCounterDone = false;
    var doExitSplash      = null;
    var splashBarEl       = document.getElementById('splash-bar');
    var splashCounterEl   = document.getElementById('splash-counter');

    function tickCounter() {
      var step = splashProgress < 70 ? 3 : splashProgress < 90 ? 1 : 0.5;
      splashProgress = Math.min(100, splashProgress + step);
      if (splashBarEl)     splashBarEl.style.width = splashProgress + '%';
      if (splashCounterEl) splashCounterEl.textContent = String(Math.floor(splashProgress)).padStart(2, '0');
      if (splashProgress >= 100) {
        splashCounterDone = true;
        if (doExitSplash) doExitSplash();
        return;
      }
      setTimeout(tickCounter, 30);
    }
    setTimeout(tickCounter, 60);

    // ── Section navigator ──────────────────────────────────
    var SECTION_NAMES = PROJECTS.map(function(p) { return p.subtitle; });
    var NAV_TOTAL = SECTION_NAMES.length;
    var navInner  = document.getElementById('nav-inner');
    var navRows   = navInner.querySelectorAll('.nav-row');

    function pad2(n) { return String(n + 1).padStart(2, '0'); }
    function fillRow(row, idx) {
      row.querySelector('.nav-num').textContent  = pad2(idx);
      row.querySelector('.nav-name').textContent = SECTION_NAMES[idx];
    }
    function updateNav(cur) {
      var prev = (cur - 1 + NAV_TOTAL) % NAV_TOTAL;
      var next = (cur + 1) % NAV_TOTAL;
      fillRow(navRows[0], prev);
      fillRow(navRows[1], cur);
      fillRow(navRows[2], next);
    }
    updateNav(0);

    // ── No-GSAP fallback ───────────────────────────────────
    function noGsapFallback() {
      var splashEl = document.getElementById('splash');
      if (splashEl) splashEl.style.display = 'none';
      document.body.style.overflow = 'auto';
      var porto = document.querySelector('.porto');
      porto.style.opacity = '1';
      porto.style.position = 'static';
      porto.style.overflow = 'visible';
      document.querySelectorAll('.page-section').forEach(function(s) {
        s.style.position = 'relative'; s.style.height = '900px';
      });
      document.querySelectorAll('.section-inner').forEach(function(s) {
        s.style.transform = 'none'; s.style.top = '0';
      });
      document.querySelectorAll(
        '.proj-card,.page-placeholder .line,.ph-label'
      ).forEach(function(el) { el.style.opacity = '1'; el.style.transform = 'none'; });
    }

    // ── Safety timeout: force-exit splash after 6 s ───────
    setTimeout(function () {
      var splashEl = document.getElementById('splash');
      if (!splashEl) return;
      if (splashEl.style.display === 'none') return;
      if (splashEl.getBoundingClientRect().bottom <= 0) return;
      console.warn('[porto] Splash safety timeout fired — forcing exit.');
      if (typeof doExitSplash === 'function') doExitSplash();
      else noGsapFallback();
    }, 6000);

    // ── Overlay state ──────────────────────────────────────
    var isOverlayOpen  = false;
    var _currentSlug   = null;
    var convObserver   = null;
    var _entranceTl    = null;
    var _entranceClone = null;
    var _sourceCard    = null;
    var _exitTl        = null;

    function navigateFromOverlay(href) {
      var match = href && href.match(/[?&]p=([^&]+)/);
      var slug = match && decodeURIComponent(match[1]);
      var nextProject = slug && window.CaseStudy && CaseStudy.resolveProject(slug);
      if (nextProject) {
        showOverlay(nextProject);
        history.pushState({ csOverlay: nextProject.slug }, '', 'case-study.html?p=' + nextProject.slug);
      } else {
        window.location.href = href;
      }
    }

    function showOverlay(rawProject, fromCard) {
      var project = CaseStudy.resolveProject(rawProject.slug);
      if (!project) throw new Error('resolveProject returned null');

      // Kill any in-flight entrance and remove its clone
      if (_entranceTl)    { _entranceTl.kill(); _entranceTl = null; }
      if (_entranceClone) {
        if (_entranceClone.parentNode) _entranceClone.parentNode.removeChild(_entranceClone);
        _entranceClone = null;
      }

      CaseStudy.teardown();
      isOverlayOpen = true;
      if (convObserver) convObserver.disable();

      var sourceLink = document.getElementById('cs-source');
      if (sourceLink) {
        if (project.sourceUrl && project.sourceUrl.trim() !== '') {
          sourceLink.href = project.sourceUrl;
          sourceLink.removeAttribute('hidden');
        } else {
          sourceLink.setAttribute('hidden', '');
        }
      }

      CaseStudy.render(project, {
        sliderEl:      document.getElementById('cs-slider'),
        detailEl:      document.getElementById('cs-detail'),
        scrollWrapper: document.getElementById('cs-right'),
        contentEl:     document.getElementById('cs-right-content'),
        exitFn:        navigateFromOverlay
      });

      var overlay = document.getElementById('cs-overlay');
      var shell   = document.getElementById('cs-shell');
      var csRight = document.getElementById('cs-right');
      overlay.classList.add('is-open');
      overlay.setAttribute('aria-hidden', 'false');
      if (shell)   shell.style.opacity = '1';
      if (csRight) csRight.scrollTop   = 0;
      _currentSlug = project.slug;

      var D    = 0.72;
      var EASE = 'power3.inOut';
      var prefersReduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      var useAnim = !!(fromCard && window.gsap && !prefersReduced);

      if (!useAnim) {
        // Instant reveal — hide homepage so it doesn't bleed through the transparent overlay
        if (window.gsap) { gsap.set('.porto', { opacity: 0 }); }
        else { var pEl = document.querySelector('.porto'); if (pEl) pEl.style.opacity = '0'; }
        document.dispatchEvent(new Event('cs-entered'));
        return;
      }

      // ── Animated entrance ──────────────────────────────────
      gsap.set('#cs-right',  { xPercent: 100 });
      gsap.set('.cs-slide[data-index="0"] .proj-card', { opacity: 0 });
      gsap.set('#cs-close',  { opacity: 0 });

      var clone = document.createElement('img');
      clone.src = fromCard.src;
      clone.style.cssText =
        'position:fixed;left:'  + fromCard.rect.left   + 'px;' +
        'top:'                  + fromCard.rect.top    + 'px;' +
        'width:'                + fromCard.rect.width  + 'px;' +
        'height:'               + fromCard.rect.height + 'px;' +
        'object-fit:cover;z-index:9999;pointer-events:none;will-change:transform;' +
        'backface-visibility:hidden;margin:0;padding:0;border:none;display:block;';
      document.body.appendChild(clone);
      _entranceClone = clone;

      // Hide the whole source card so only the clone is visible during the glide
      gsap.set(fromCard.card, { opacity: 0 });
      _sourceCard = fromCard.card;

      function runEntrance() {
        var destEl   = document.querySelector('.cs-slide[data-index="0"] .proj-card');
        var destRect = destEl ? destEl.getBoundingClientRect() : null;

        // Compute translation offsets so position is animated via transform (GPU path)
        var dx = destRect ? destRect.left - fromCard.rect.left : 0;
        var dy = destRect ? destRect.top  - fromCard.rect.top  : 0;

        _entranceTl = gsap.timeline({
          onComplete: function() {
            gsap.set('.cs-slide[data-index="0"] .proj-card', { opacity: 1 });
            gsap.set('#cs-right', { xPercent: 0 });
            if (clone.parentNode) clone.parentNode.removeChild(clone);
            _entranceTl = null; _entranceClone = null;
          }
        });

        _entranceTl.to('.porto',    { opacity: 0, duration: D * 0.7, ease: EASE }, 0);
        _entranceTl.to('#cs-right', { xPercent: 0, duration: D, ease: EASE }, 0);

        if (destRect) {
          _entranceTl.to(clone, {
            x: dx, y: dy,
            width: destRect.width, height: destRect.height,
            duration: D, ease: EASE,
            onComplete: function() {
              gsap.set(destEl, { opacity: 1 });
              if (clone.parentNode) clone.parentNode.removeChild(clone);
            }
          }, 0);
        }

        _entranceTl.add(function() { document.dispatchEvent(new Event('cs-entered')); }, D * 0.55);

        _entranceTl.to('#cs-close', { opacity: 0.5, duration: 0.4, ease: 'power2.out' }, D * 0.80);
      }

      if (clone.complete) {
        runEntrance();
      } else {
        var _dec = false;
        var _to  = setTimeout(function() { if (!_dec) { _dec = true; runEntrance(); } }, 200);
        clone.onload  = function() { if (!_dec) { _dec = true; clearTimeout(_to); runEntrance(); } };
        clone.onerror = function() { if (!_dec) { _dec = true; clearTimeout(_to); runEntrance(); } };
      }
    }

    function hideOverlay() {
      // Kill any in-flight entrance/exit and remove entrance clone
      if (_entranceTl)    { _entranceTl.kill(); _entranceTl = null; }
      if (_entranceClone) {
        if (_entranceClone.parentNode) _entranceClone.parentNode.removeChild(_entranceClone);
        _entranceClone = null;
      }
      if (_exitTl) { _exitTl.kill(); _exitTl = null; }

      var D    = 0.72;
      var EASE = 'power3.inOut';
      var prefersReduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      var canAnimate     = !!(window.gsap && !prefersReduced && _sourceCard);

      if (!canAnimate) {
        // ── Instant fallback (no gsap, reduced-motion, or no source card) ──
        CaseStudy.teardown();
        var overlay = document.getElementById('cs-overlay');
        var shell   = document.getElementById('cs-shell');
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        if (shell) shell.style.opacity = '0';
        if (window.gsap) {
          gsap.set('.porto', { opacity: 1 });
          gsap.set('.cs-slide[data-index="0"] .proj-card', { opacity: 1 });
          gsap.set('#cs-right', { xPercent: 0 });
          if (_sourceCard) { gsap.set(_sourceCard, { opacity: 1 }); }
        } else {
          var pEl = document.querySelector('.porto'); if (pEl) pEl.style.opacity = '1';
        }
        _sourceCard = null;
        if (convObserver) convObserver.enable();
        isOverlayOpen = false;
        _currentSlug  = null;
        return;
      }

      // ── Animated reverse close ────────────────────────────────
      var realCardEl = document.querySelector('.cs-slide[data-index="0"] .proj-card');
      var startRect  = realCardEl ? realCardEl.getBoundingClientRect() : null;
      var destRect   = _sourceCard.getBoundingClientRect();
      var imgEl      = realCardEl ? realCardEl.querySelector('img') : null;

      var clone = document.createElement('img');
      clone.src = imgEl ? (imgEl.currentSrc || imgEl.src) : '';
      if (startRect) {
        clone.style.cssText =
          'position:fixed;left:'  + startRect.left   + 'px;' +
          'top:'                  + startRect.top    + 'px;' +
          'width:'                + startRect.width  + 'px;' +
          'height:'               + startRect.height + 'px;' +
          'object-fit:cover;z-index:9999;pointer-events:none;will-change:transform;' +
          'backface-visibility:hidden;margin:0;padding:0;border:none;display:block;';
      }
      document.body.appendChild(clone);

      // Hide real left card so only the clone is visible during the glide
      if (realCardEl) gsap.set(realCardEl, { opacity: 0 });

      var capturedSourceCard = _sourceCard; // capture now; _sourceCard nulled in onComplete

      _exitTl = gsap.timeline({
        onComplete: function() {
          gsap.set(capturedSourceCard, { opacity: 1 });
          if (clone.parentNode) clone.parentNode.removeChild(clone);
          CaseStudy.teardown();
          var overlay = document.getElementById('cs-overlay');
          var shell   = document.getElementById('cs-shell');
          overlay.classList.remove('is-open');
          overlay.setAttribute('aria-hidden', 'true');
          if (shell) shell.style.opacity = '0';
          gsap.set('.cs-slide[data-index="0"] .proj-card', { opacity: 1 });
          gsap.set('#cs-right', { xPercent: 0 });
          if (convObserver) convObserver.enable();
          isOverlayOpen = false;
          _currentSlug  = null;
          _sourceCard   = null;
          _exitTl       = null;
        }
      });

      if (startRect) {
        _exitTl.to(clone, {
          x: destRect.left - startRect.left,
          y: destRect.top  - startRect.top,
          width:  destRect.width,
          height: destRect.height,
          duration: D, ease: EASE
        }, 0);
      }

      _exitTl.to('#cs-right', { xPercent: 100,  duration: D,       ease: EASE }, 0);
      _exitTl.to('.porto',    { opacity:  1,     duration: D * 0.7, ease: EASE }, 0);
      _exitTl.to('#cs-close', { opacity:  0,     duration: 0.2               }, 0);
    }

    // ── Main ───────────────────────────────────────────────
    window.addEventListener('load', function () {
      if (!window.gsap || !window.Observer) { noGsapFallback(); return; }
      gsap.registerPlugin(Observer);
      history.replaceState({ csOverlay: null }, '', location.href);

      var sections = Array.from(document.querySelectorAll('.page-section'));
      // `images` and `sections` alias the same array intentionally:
      // `images` is the Y-position / GSAP-animation role; `sections` is the DOM-management role.
      var images = sections;

      // ── Initial hidden states ──
      sections.forEach(function(sec) {
        var label = sec.querySelector('.ph-label');
        if (label) gsap.set(label, { opacity: 1 });
        gsap.set(sec.querySelectorAll('.ph-label .char, .ph-title .char'), { yPercent: 40, opacity: 0 });
      });

      // ── Scroll Parallax System ──────────────────────
      var TOTAL    = PROJECTS.length;
      var current  = 0;
      var animating = false;
      var VH = window.innerHeight;

      var PEEK_BELOW = 0.64;   // next section peeking from the bottom
      var PEEK_ABOVE = -0.58;  // previous section peeking from the top
      var PARK_BELOW = 1.5;    // parked just below the viewport
      var PARK_ABOVE = -1.5;   // parked just above the viewport

      // ── Card click → case study ────────────────────────
      sections.forEach(function(section, i) {
        var card = section.querySelector('.proj-card');
        if (!card) return;
        var slug = PROJECTS[i] && PROJECTS[i].slug;
        if (!slug) return;
        card.addEventListener('click', function() {
          if (animating) return;
          if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
            window.location.href = 'case-study.html?p=' + slug; return;
          }
          // Try in-place overlay; fall back to full-page navigation if unavailable
          if (window.CaseStudy && PROJECTS[i]) {
            var imgEl = card.querySelector('img');
            var fromCard = null;
            if (imgEl) {
              gsap.set(imgEl, { rotateX: 0, rotateY: 0, scale: 1 });
              fromCard = { card: card, rect: imgEl.getBoundingClientRect(), src: imgEl.currentSrc || imgEl.src };
            }
            try {
              showOverlay(PROJECTS[i], fromCard);
              history.pushState({ csOverlay: slug }, '', 'case-study.html?p=' + slug);
              return;
            } catch (e) {
              console.error('[porto] showOverlay failed, falling back:', e);
              isOverlayOpen = false;
              _currentSlug = null;
              if (convObserver) convObserver.enable();
            }
          }
          // Fallback: original page-wipe navigation (kept until SPA is proven)
          var imgEl = card.querySelector('img');
          if (imgEl && window.gsap) gsap.set(imgEl, {rotateX:0,rotateY:0,scale:1});
          var rect = card.getBoundingClientRect();
          var src = imgEl ? (imgEl.currentSrc || imgEl.src) : '';
          try {
            sessionStorage.setItem('cs-wipe', '1');
            sessionStorage.setItem('cs-flip', JSON.stringify({ src: src, x: rect.left, y: rect.top, w: rect.width, h: rect.height, slug: slug }));
          } catch (e) {}
          var wipe = document.getElementById('page-wipe');
          if (window.gsap && wipe) {
            gsap.set(wipe, { xPercent: 100 });
            gsap.to(wipe, { xPercent: 0, duration: 0.7, ease: 'expo.inOut',
              onComplete: function () { window.location.href = 'case-study.html?p=' + slug; }
            });
          } else {
            window.location.href = 'case-study.html?p=' + slug;
          }
        });
      });

      function imgY(i, cur) {
        var fd = (i - cur + TOTAL) % TOTAL;
        if (fd === 0)         return 0;
        if (fd === 1)         return VH * PEEK_BELOW;
        if (fd === TOTAL - 1) return VH * PEEK_ABOVE;
        if (fd === 2)         return VH * PARK_BELOW;
        if (fd === TOTAL - 2) return VH * PARK_ABOVE;
        return VH * PARK_BELOW;
      }

      function imgZ(fd) {
        if (fd === 1)         return 30;
        if (fd === 0)         return 20;
        if (fd === TOTAL - 1) return 25;
        return 10;
      }

      // on-screen slots must animate, not snap
      function onScreen(fd) {
        return fd === 0 || fd === 1 || fd === TOTAL - 1;
      }

      images.forEach(function(el, i) {
        gsap.set(el, { y: imgY(i, 0) });
        sections[i].style.zIndex = imgZ((i - 0 + TOTAL) % TOTAL);
      });
      sections[0].classList.add('is-active');

      function sectionText(idx) {
        var sec = sections[idx];
        if (!sec) return { small: null, big: null };
        return {
          small: sec.querySelectorAll('.ph-label .char'),
          big:   sec.querySelectorAll('.ph-title .char')
        };
      }

      function revealText(tl, t) {
        if (t.big   && t.big.length)   tl.fromTo(t.big,   { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.7, ease: 'power3.out', stagger: { each: 0.022, from: 'start' } }, 0.25);
        if (t.small && t.small.length) tl.fromTo(t.small, { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.6, ease: 'power3.out', stagger: { each: 0.016 } }, 0.35);
      }

      function hideText(tl, t) {
        if (t.big   && t.big.length)   tl.to(t.big,   { yPercent: -40, opacity: 0, duration: 0.35, ease: 'power3.in', stagger: { each: 0.008, from: 'end' } }, 0);
        if (t.small && t.small.length) tl.to(t.small, { yPercent: -40, opacity: 0, duration: 0.3,  ease: 'power3.in' }, 0);
      }

      function go(dir) {
        if (animating) return;
        animating = true;

        var prev = current;

        // Kill any running tweens on the outgoing section to prevent conflicts
        var outgoing = sectionText(prev);
        if (outgoing.big)   gsap.killTweensOf(outgoing.big);
        if (outgoing.small) gsap.killTweensOf(outgoing.small);
        current = (prev + dir + TOTAL) % TOTAL;

        sections.forEach(function(s) { s.classList.remove('is-active'); });
        sections[current].classList.add('is-active');

        images.forEach(function(el) { el.style.willChange = 'transform'; });

        var tl = gsap.timeline({
          onComplete: function() {
            animating = false;
            images.forEach(function(el) { el.style.willChange = 'auto'; });
            sections[current].style.zIndex = imgZ(0); // restore resting layer
          }
        });

        images.forEach(function(el, i) {
          var fdNew = (i - current + TOTAL) % TOTAL;
          var fdOld = (i - prev    + TOTAL) % TOTAL;
          sections[i].style.zIndex = imgZ(fdNew);
          if (onScreen(fdNew) || onScreen(fdOld)) {
            tl.to(el, { y: imgY(i, current), duration: 1.1, ease: 'expo.inOut' }, 0);
          } else {
            gsap.set(el, { y: imgY(i, current) });
          }
        });

        // lift incoming section above all while it travels to centre,
        // so the outgoing card can't cover it (the scroll-up collision)
        sections[current].style.zIndex = 50;

        // Text reveal / exit
        if (prev !== current) hideText(tl, sectionText(prev));

        // Hard-reset incoming section chars before reveal (prevents stale positions)
        var incoming = sectionText(current);
        if (incoming.big   && incoming.big.length)   gsap.set(incoming.big,   { yPercent: 40, opacity: 0 });
        if (incoming.small && incoming.small.length) gsap.set(incoming.small, { yPercent: 40, opacity: 0 });

        revealText(tl, sectionText(current));

        // Nav update
        tl.to(navInner, {
          opacity: 0, y: dir > 0 ? -10 : 10, duration: 0.16, ease: 'power2.in',
          onComplete: function() {
            updateNav(current);
            gsap.set(navInner, { y: dir > 0 ? 10 : -10 });
          }
        }, 0.08)
        .to(navInner, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.3);
      }

      convObserver = Observer.create({
        type: 'wheel,touch',
        onDown: function() { go(1);  },
        onUp:   function() { go(-1); },
        tolerance: 10,
        preventDefault: true
      });

      window.addEventListener('resize', function() {
        VH = window.innerHeight;
        images.forEach(function(el, i) { gsap.set(el, { y: imgY(i, current) }); });
      });

      window.addEventListener('keydown', function(e) {
        if (isOverlayOpen) return;
        if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { go(1);  e.preventDefault(); }
        else if (e.key === 'ArrowUp'   || e.key === 'PageUp')               { go(-1); e.preventDefault(); }
      });

      navRows[0].addEventListener('click', function() { if (!animating && !isOverlayOpen) go(-1); });
      navRows[2].addEventListener('click', function() { if (!animating && !isOverlayOpen) go(1);  });

      // ── Close button for the in-place overlay ─────────────
      var csCloseBtn = document.getElementById('cs-close');
      if (csCloseBtn) {
        csCloseBtn.addEventListener('click', function(e) {
          e.preventDefault();
          history.back();
        });
      }

      // ── History navigation (popstate) ─────────────────────
      window.addEventListener('popstate', function(e) {
        var target = (e.state && e.state.csOverlay) || null;
        if (target && target !== _currentSlug) {
          var p = CaseStudy.resolveProject(target);
          if (p) showOverlay(p);
        } else if (!target && _currentSlug) {
          hideOverlay();
        }
      });

      // ── Splash exit → intro ────────────────────────────
      var splashExited = false;
      animating = true;

      doExitSplash = function() {
        if (splashExited) return;
        splashExited = true;
        var splashEl = document.getElementById('splash');
        var introTl = gsap.timeline({ onComplete: function() { animating = false; } });
        introTl
          .to(splashEl, { yPercent: -105, duration: 1.0, ease: 'expo.inOut' }, 0)
          .to('.porto',  { opacity: 1,    duration: 0.5,  ease: 'power2.out' }, 0.3);
        revealText(introTl, sectionText(0));
      };

      if (splashCounterDone) doExitSplash();
    });

   // ── Custom proj-card cursor ──────────────────────────
   (function() {
     var cursor = document.getElementById('proj-cursor');
     if (!cursor) { console.warn('proj-cursor element not found'); return; }


     var mouseX = window.innerWidth / 2;
     var mouseY = window.innerHeight / 2;
     var curX = mouseX, curY = mouseY;
     var rafId = null;

     function lerp(a, b, t) { return a + (b - a) * t; }

     function loop() {
       curX = lerp(curX, mouseX, 0.12);
       curY = lerp(curY, mouseY, 0.12);
       cursor.style.left = curX + 'px';
       cursor.style.top  = curY + 'px';
       rafId = requestAnimationFrame(loop);
     }

     // Always track mouse globally
     document.addEventListener('mousemove', function(e) {
       mouseX = e.clientX;
       mouseY = e.clientY;
     });

     // Start RAF loop once, permanently
     loop();

     // Use event delegation on document to catch all .proj-card hovers
     document.addEventListener('mouseover', function(e) {
       if (e.target.closest('.proj-card')) {
         cursor.classList.add('is-visible');
         document.body.style.cursor = 'none';
       }
     });

     document.addEventListener('mouseout', function(e) {
       if (e.target.closest('.proj-card')) {
         var related = e.relatedTarget;
         if (!related || !related.closest('.proj-card')) {
           cursor.classList.remove('is-visible');
           document.body.style.cursor = '';
         }
       }
     });
   })();

   // ── proj-card 3D tilt ────────────────────────────────
   (function() {
     document.addEventListener('mousemove', function(e) {

       var card = e.target.closest('.proj-card');
       if (!card) return;
       var img = card.querySelector('img');
       if (!img) return;
       var rect = card.getBoundingClientRect();
       var nx = (e.clientX - rect.left) / rect.width;
       var ny = (e.clientY - rect.top) / rect.height;
       var rx = (nx - 0.5) * 2;
       var ry = (ny - 0.5) * 2;
       var rotateX = ry * -10;
       var rotateY = rx * 10;
       gsap.to(img, { rotateX: rotateX, rotateY: rotateY, scale: 1.04, duration: 0.6, ease: 'power2.out', overwrite: 'auto' });
     });

     document.addEventListener('mouseout', function(e) {
       var card = e.target.closest('.proj-card');
       if (!card) return;
       var related = e.relatedTarget;
       if (related && related.closest('.proj-card')) return;
       var img = card.querySelector('img');
       if (!img) return;
       gsap.to(img, { rotateX: 0, rotateY: 0, scale: 1, duration: 0.7, ease: 'power3.out', overwrite: 'auto' });
     });
   })();
  })(); /* end outer IIFE */
  </script>
</body>
</html>
