<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ilham — Porto</title>

  <link href="https://api.fontshare.com/v2/css?f[]=recoleta@300&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: 'ITC Garamond Std';
      font-style: italic;
      font-weight: 300;
      src: local('ITC Garamond Std Light Narrow Italic'),
           local('ITCGaramondStd-LtNarrIt'),
           local('ITC Garamond Std Light Italic');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #fff; overflow: hidden; }

    .porto { position: fixed; inset: 0; overflow: hidden; background: #fff; }
    .page-section { position: absolute; inset: 0; overflow: hidden; }

    .section-inner {
      position: absolute;
      left: 0;
      top: 50%;
      width: 1440px;
      height: 900px;
      transform: translateY(-50%);
    }

    /* ── Background grid (Figma: Grid layers - v1, #222020 @ 80.68px) ── */
    .grid-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(to right,  rgba(34,32,32,0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34,32,32,0.06) 1px, transparent 1px);
      background-size: 80.68px 80.68px;
    }


    /* ── Ellipse overlay (Figma: elipse overlay 61:6389) ──
       Radial vignette to white. Sits above images/peeks (z:2) but below
       hero text (z:4). Uses ellipse sized to container so it reaches all 4 edges. */
    .ellipse-overlay {
      position: absolute; inset: 0; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse 65% 65% at 50% 50%,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0) 30%,
        rgba(255,255,255,0.55) 58%,
        rgba(255,255,255,0.92) 78%,
        #fff 92%);
    }

    /* ── Navbar ── */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 56px; z-index: 1000;
    }
    .logo { position: relative; width: 72px; height: 58px; flex-shrink: 0; }
    .logo img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .nav-pill {
      display: flex; align-items: center; background: #dfdfdf;
      border-radius: 999px; padding: 4px; flex-shrink: 0;
    }
    .nav-item {
      display: flex; align-items: center; justify-content: center;
      padding: 12px 24px; border-radius: 9999px;
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 20px; line-height: 1.3; letter-spacing: -0.2px;
      color: #000; cursor: pointer; white-space: nowrap; transition: background 0.18s;
    }
    .nav-item.active { background: #fff; }
    .nav-item:hover:not(.active) { background: rgba(255,255,255,0.55); }

    /* ── Hero ── */
    .hero {
      position: absolute; top: 0; left: 0; width: 1440px; height: 900px;
    }
    .hero-text {
      position: absolute; left: 56px; top: 316px; height: 270px;
      display: flex; flex-direction: column; gap: 8px; justify-content: center;
      width: 480px; padding: 8px 0; z-index: 4;
    }
    .hero-subtitle {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 20px; line-height: 1.3; letter-spacing: -0.2px; color: #000; width: 229px;
    }
    .hero-title {
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 100px; line-height: 1.1; letter-spacing: -1px; color: #000;
    }
    .line-mask {
      display: block; overflow: hidden;
      padding-block: 0.14em; margin-block: -0.14em;
    }
    .line-mask .line { display: block; white-space: nowrap; will-change: transform; }
    .char { display: inline-block; will-change: transform, opacity; }

    /* ── Image block (Hero) ── */
    .image-block {
      position: absolute; left: 508px; top: 239px;
      width: 424px; height: 460px;
      will-change: transform;
    }
    .image-bg { position: absolute; inset: 0; background: linear-gradient(to bottom, #9f4bed, #7b49a9); }
    .image-photo {
      position: absolute; top: 77px; left: 11px;
      width: 413px; height: 383px; object-fit: cover;
    }

    /* ── Camera viewfinder brackets (from Figma 55:5795) ── */
    .viewfinder {
      position: absolute; inset: 0;
      display: inline-block;
      pointer-events: none;
    }
    .viewfinder span {
      position: absolute;
      width: 24px; height: 24px;
    }
    .vf-tl { top: -16px;    left: -16px;  border-top: 6px solid #FF3ECF;    border-left: 6px solid #FF3ECF;  border-top-left-radius: 2px; }
    .vf-tr { top: -16px;    right: -16px; border-top: 6px solid #FF3ECF;    border-right: 6px solid #FF3ECF; border-top-right-radius: 2px; }
    .vf-bl { bottom: -16px; left: -16px;  border-bottom: 6px solid #FF3ECF; border-left: 6px solid #FF3ECF;  border-bottom-left-radius: 2px; }
    .vf-br { bottom: -16px; right: -16px; border-bottom: 6px solid #FF3ECF; border-right: 6px solid #FF3ECF; border-bottom-right-radius: 2px; }

    /* ── Section navigator (right) ── */
    .section-nav {
      position: fixed; left: 1128px; top: 50%;
      transform: translateY(calc(-50% - 12px));
      width: 189px; z-index: 100; user-select: none;
    }
    .nav-inner { display: flex; flex-direction: column; gap: 24px; will-change: transform, opacity; }
    .nav-row {
      display: flex; align-items: center; gap: 16px;
      position: relative; white-space: nowrap;
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      color: #000; line-height: 1.3;
    }
    .nav-row.is-inactive { opacity: 0.2; cursor: pointer; }
    .nav-num  { font-size: 16px; letter-spacing: -0.16px; min-width: 22px; }
    .nav-name { font-size: 24px; letter-spacing: -0.24px; }
    .nav-chevron {
      position: absolute; left: -30px; top: 50%;
      transform: translateY(-50%);
      width: 24px; height: 24px; display: none;
    }
    .nav-row.is-current .nav-chevron { display: block; }
    .nav-chevron svg { width: 100%; height: 100%; display: block; }

    /* ── Bottom bar ── */
    .bottom-location {
      position: fixed; bottom: 0; left: 0;
      display: flex; align-items: center; padding: 24px 56px; z-index: 1000;
    }
    .bottom-location p {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 16px; line-height: 1.3; letter-spacing: -0.16px; color: #000; white-space: nowrap;
    }

    /* ── BYOND section ── */
    .byond-text {
      position: absolute; left: 88px; top: 253px;
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 100px; line-height: 1.1; letter-spacing: -1px; color: #000;
    }
    .byond-phone {
      position: absolute; left: 612px; top: 110px;
      width: 338px; height: 679px; will-change: transform; background: transparent;
    }
    .byond-phone img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* ── Placeholder sections ── */
    .ph-layout {
      position: absolute; top: 181px; left: 0; width: 1440px;
      display: flex; align-items: center; gap: 74px; padding: 0 56px;
    }
    .ph-text {
      display: flex; flex-direction: column; gap: 8px;
      width: 480px; padding: 8px 0; flex-shrink: 0;
    }
    .ph-label {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 20px; line-height: 1.3; letter-spacing: -0.2px; color: #000; width: 229px;
    }
    .ph-title {
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 100px; line-height: 1.1; letter-spacing: -1px; color: #000;
    }
    .ph-image {
      position: relative; width: 418px; height: 437px;
      flex-shrink: 0; will-change: transform;
      display: flex; align-items: flex-end; justify-content: flex-start; padding: 20px 24px;
    }
    .ph-image-label {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    .image-block,
    .byond-phone,
    .ph-image { will-change: transform; }

    /* ── Pre-GSAP hide (prevents flash before load) ── */
    .byond-text .line,
    .page-placeholder .line,
    .page-placeholder .ph-label,
    .page-placeholder .ph-image { opacity: 0; }
  </style>
</head>
<body>
  <div class="porto">

  <!-- Background grid (Figma: Grid layers - v1) -->
  <div class="grid-bg"></div>

  <!-- Section 1: heyitsilham -->
  <div class="page-section page-hero">
    <div class="section-inner">
      <section class="hero">
        <div class="hero-text">
          <p class="hero-subtitle" id="hero-subtitle">Welcome to my house.</p>

  <!-- ── Persistent UI ── -->
  <nav class="navbar">

      <img src="assets/images/Am_LOGO.png" alt="Ilham logo" />
    </div>
    <div class="nav-pill">

  <div class="section-nav" id="section-nav">
    <div class="nav-inner" id="nav-inner">
      <div class="nav-row is-inactive" data-rel="-1">
        <span class="nav-num"></span><span class="nav-name"></span>

      <div class="nav-row is-current">
        <span class="nav-chevron">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

              stroke-linecap="round" stroke-linejoin="round"/>

        </span>
        <span class="nav-num"></span><span class="nav-name"></span>

      <div class="nav-row is-inactive" data-rel="1">

  <div class="bottom-location">
    <p id="jakarta-time">based in Jakarta, 14:30 WIB</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>

  <script>
    // ── Clock ──────────────────────────────────────────────
    function updateTime() {
      var t = new Intl.DateTimeFormat('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Jakarta'
      }).format(new Date());
      document.getElementById('jakarta-time').textContent = 'based in Jakarta, ' + t + ' WIB';
    }
    updateTime();
    setInterval(updateTime, 1000);

    // ── Character split for hero title ────────────────────
    function splitChars() {
      var sels = [
        '.hero-title .line',
        '.hero-subtitle',
        '.byond-text .line',
        '.ph-label',
        '.ph-title .line'
      ];
      sels.forEach(function(sel) {
        document.querySelectorAll(sel).forEach(function(el) {
          var text = el.textContent;
          el.textContent = '';
          text.split('').forEach(function(ch) {
            var s = document.createElement('span');
            s.className = 'char';
            s.textContent = ch === ' ' ? ' ' : ch;
            el.appendChild(s);
          });
        });
      });
    }
    splitChars();

    // ── Section navigator ──────────────────────────────────
    var SECTION_NAMES = [
      "Ilham's Profile", "BYOND by BSI", "Project 03",
      "Project 04", "Project 05", "Qita by BRI"
    ];
    var NAV_TOTAL = SECTION_NAMES.length;
    var navInner  = document.getElementById('nav-inner');
    var navRows   = navInner.querySelectorAll('.nav-row');

    function pad2(n) { return String(n + 1).padStart(2, '0'); }
    function fillRow(row, idx) {
      row.querySelector('.nav-num').textContent  = pad2(idx);
      row.querySelector('.nav-name').textContent = SECTION_NAMES[idx];
    }
    function updateNav(cur) {
      var prev = (cur - 1 + NAV_TOTAL) % NAV_TOTAL;
      var next = (cur + 1) % NAV_TOTAL;
      fillRow(navRows[0], prev);
      fillRow(navRows[1], cur);
      fillRow(navRows[2], next);
    }
    updateNav(0);

    // ── No-GSAP fallback ───────────────────────────────────
    function noGsapFallback() {
      document.body.style.overflow = 'auto';
      var porto = document.querySelector('.porto');
      porto.style.position = 'static';
      porto.style.overflow = 'visible';
      document.querySelectorAll('.page-section').forEach(function(s) {
        s.style.position = 'relative'; s.style.height = '900px';
      });
      document.querySelectorAll('.section-inner').forEach(function(s) {
        s.style.transform = 'none'; s.style.top = '0';
      });
      document.querySelectorAll(
        '.byond-text .line,.byond-phone,.page-placeholder .line,.ph-label,.ph-image'
      ).forEach(function(el) { el.style.opacity = '1'; el.style.transform = 'none'; });
    }

    // ── Main ───────────────────────────────────────────────
    window.addEventListener('load', function () {
      if (!window.gsap || !window.Observer) { noGsapFallback(); return; }
      gsap.registerPlugin(Observer);

      // ── Initial hidden states ──
      gsap.set('.image-photo',             { y: 0 });
      gsap.set('.byond-phone',             { y: 0, opacity: 1 });
      gsap.set('.byond-text .line',        { opacity: 1 });
      gsap.set('.byond-text .char',        { yPercent: 40, opacity: 0 });

      var placeholders = document.querySelectorAll('.page-placeholder');
      placeholders.forEach(function(ph) {
        gsap.set(ph.querySelectorAll('.ph-label, .ph-title .line'), { opacity: 1 });
        gsap.set(ph.querySelectorAll('.ph-label .char, .ph-title .char'), { opacity: 0, yPercent: 110 });
        gsap.set(ph.querySelector('.ph-image'), { y: 0, opacity: 1 });
      });


      // ── Image click → case study ───────────────────────
      // page-section has pointer-events:none (CSS), so only the element we
      // explicitly mark 'auto' can receive clicks — preventing the topmost
      // stacked section from swallowing events meant for the active one.
      var imgEls = [
        document.querySelector('.image-block'),
        document.querySelector('.byond-phone')
      ];
      placeholders.forEach(function(ph) {
        imgEls.push(ph ? ph.querySelector('.ph-image') : null);
      });


      // ── Scroll Parallax System ──────────────────────
      var TOTAL    = 6;
      var current  = 0;
      var animating = false;
      var VH = window.innerHeight;

      var imgFlynn = document.querySelector('.image-block');
      var imgByond = document.querySelector('.byond-phone');
      var imgPh    = document.querySelectorAll('.ph-image');

      // Initial positions: Flynn center, BYOND below, placeholders further below
      gsap.set(imgFlynn, { y: 0 });
      gsap.set(imgByond, { y: VH });
      imgPh.forEach(function(el, i) {
        gsap.set(el, { y: VH * (1.5 + i * 0.3) });
      });

      function go(dir) {
        if (animating) return;
        animating = true;

        var prev = current;
        current  = Math.max(0, Math.min(TOTAL - 1, current + dir));
        if (current === prev) { animating = false; return; }

        var tl = gsap.timeline({
          onComplete: function() { animating = false; }
        });

        // Flynn: center on section 0, exit up on all others
        tl.to(imgFlynn, { y: current === 0 ? 0 : -VH * 0.8, duration: 1.0, ease: 'expo.inOut' }, 0);

        // BYOND: below on section 0, center on section 1, exit up on section 2+
        var byondY = current === 0 ? VH : current === 1 ? 0 : -VH * 0.8;
        tl.to(imgByond, { y: byondY, duration: 1.1, ease: 'expo.inOut' }, ">-1.06");

        // Placeholders: each enters center when it's the active section
        imgPh.forEach(function(el, i) {
          var sectionIdx = i + 2;
          var phY, phDur, phEase;
          if (current < sectionIdx) {
            phY = VH * (1 + (sectionIdx - current) * 0.4);
            phDur = 1.05; phEase = 'expo.inOut';
          } else if (current === sectionIdx) {
            phY = 0;
            phDur = 1.05; phEase = 'expo.out';
          } else {
            phY = -VH * 0.8;
            phDur = 0.9; phEase = 'expo.in';
          }
          tl.to(el, { y: phY, duration: phDur, ease: phEase }, 0);
        });

        // Hero text
        if (current === 0) {
          tl.to('.hero-title .char',    { yPercent: 0, opacity: 1, duration: 0.7, ease: 'power3.out', stagger: { each: 0.022, from: 'start' } }, 0.25);
          tl.to('.hero-subtitle .char', { yPercent: 0, opacity: 1, duration: 0.6, ease: 'power3.out', stagger: { each: 0.016 } }, 0.35);
        } else {
          tl.to('.hero-title .char',    { yPercent: -40, opacity: 0, duration: 0.35, ease: 'power3.in', stagger: { each: 0.008, from: 'end' } }, 0);
          tl.to('.hero-subtitle .char', { yPercent: -40, opacity: 0, duration: 0.3,  ease: 'power3.in' }, 0);
        }

        // BYOND text
        if (current === 1) {
          tl.to('.byond-text .char', { yPercent: 0, opacity: 1, duration: 0.7, ease: 'power3.out', stagger: { each: 0.018, from: 'start' } }, 0.3);
        } else if (prev === 1) {
          tl.to('.byond-text .char', { yPercent: -40, opacity: 0, duration: 0.35, ease: 'power3.in', stagger: { each: 0.008, from: 'end' } }, 0);
        }

        // Nav update
        tl.to(navInner, {
          opacity: 0, y: dir > 0 ? -10 : 10, duration: 0.16, ease: 'power2.in',
          onComplete: function() {
            updateNav(current);
            gsap.set(navInner, { y: dir > 0 ? 10 : -10 });
          }
        }, 0.08)
        .to(navInner, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.3);
      }

      gsap.set('.hero-title .char',    { yPercent: 0, opacity: 1 });
      gsap.set('.hero-subtitle .char', { yPercent: 0, opacity: 1 });

      Observer.create({
        type: 'wheel,touch',
        onDown: function() { go(1);  },
        onUp:   function() { go(-1); },
        tolerance: 10,
        preventDefault: true
      });

      window.addEventListener('resize', function() {
        VH = window.innerHeight;
        gsap.set(imgFlynn, { y: current === 0 ? 0 : -VH * 0.8 });
        gsap.set(imgByond, { y: current === 0 ? VH : current === 1 ? 0 : -VH * 0.8 });
        imgPh.forEach(function(el, i) {
          var sectionIdx = i + 2;
          var phY;
          if (current < sectionIdx)        phY = VH * (1 + (sectionIdx - current) * 0.4);
          else if (current === sectionIdx) phY = 0;
          else                             phY = -VH * 0.8;
          gsap.set(el, { y: phY });
        });
      });

      window.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { go(1);  e.preventDefault(); }
        else if (e.key === 'ArrowUp'   || e.key === 'PageUp')               { go(-1); e.preventDefault(); }
      });

      navRows[0].addEventListener('click', function() { if (!animating) go(-1); });
      navRows[2].addEventListener('click', function() { if (!animating) go(1);  });

      gsap.from('.porto', { opacity: 0, duration: 0.45, ease: 'power2.out' });
    });
  </script>
</body>
</html>
