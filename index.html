<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ilham — Porto</title>

  <link href="https://api.fontshare.com/v2/css?f[]=recoleta@300&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: 'ITC Garamond Std';
      font-style: italic;
      font-weight: 300;
      src: local('ITC Garamond Std Light Narrow Italic'),
           local('ITCGaramondStd-LtNarrIt'),
           local('ITC Garamond Std Light Italic');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #fff; overflow: hidden; }

    .porto { position: fixed; inset: 0; overflow: hidden; background: #fff; }
    .page-section { position: absolute; inset: 0; pointer-events: none; }

    .section-inner {
      position: absolute;
      left: 0;
      top: 50%;
      width: 1440px;
      height: 900px;
      transform: translateY(-50%);
    }

    /* ── Soft edge overlays ── */
    .edge-fade {
      position: fixed; left: 0; width: 100%; height: 180px;
      pointer-events: none; z-index: 50;
    }
    .edge-fade.top    { top: 0;    background: linear-gradient(to bottom, #fff 16%, rgba(255,255,255,0) 100%); }
    .edge-fade.bottom { bottom: 0; background: linear-gradient(to top,   #fff 16%, rgba(255,255,255,0) 100%); }

    /* ── Navbar ── */
    .navbar {
      position: fixed; top: 16px; left: 40px; width: 841px;
      display: flex; align-items: center; justify-content: space-between; z-index: 1000;
    }
    .logo { position: relative; width: 72px; height: 58px; flex-shrink: 0; }
    .logo img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .nav-pill {
      display: flex; align-items: center; background: #f5f5f5;
      border-radius: 999px; padding: 4px; flex-shrink: 0;
    }
    .nav-item {
      display: flex; align-items: center; justify-content: center;
      padding: 12px 24px; border-radius: 9999px;
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 20px; line-height: 1.3; letter-spacing: -0.2px;
      color: #000; cursor: pointer; white-space: nowrap; transition: background 0.18s;
    }
    .nav-item.active { background: #fff; }
    .nav-item:hover:not(.active) { background: rgba(255,255,255,0.55); }

    /* ── Hero ── */
    .hero {
      position: absolute; top: 181px; left: 0; width: 1440px;
      display: flex; align-items: center; gap: 74px; padding: 0 56px;
    }
    .hero-text {
      display: flex; flex-direction: column; gap: 8px;
      width: 480px; padding: 8px 0; flex-shrink: 0;
    }
    .hero-subtitle {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 20px; line-height: 1.3; letter-spacing: -0.2px; color: #000; width: 229px;
    }
    .hero-title {
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 100px; line-height: 1.1; letter-spacing: -1px; color: #000;
    }
    .line-mask {
      display: block; overflow: hidden;
      padding-block: 0.14em; margin-block: -0.14em;
    }
    .line-mask .line { display: block; white-space: nowrap; will-change: transform; }
    .char { display: inline-block; will-change: transform, opacity; }

    /* ── Image block (Hero) ── */
    .image-block {
      position: relative; width: 418px; height: 437px;
      flex-shrink: 0; will-change: transform;
    }
    .image-bg { position: absolute; inset: 0; background: linear-gradient(to bottom, #9f4bed, #7b49a9); }
    .image-photo {
      position: absolute; top: 66px; left: 18px;
      width: 400px; height: 370.558px; object-fit: cover;
    }
    .image-mask {
      position: absolute; inset: 0; background: #fff;
      opacity: 0; pointer-events: none;
    }

    /* ── Camera viewfinder brackets (from Figma 55:5795) ── */
    .viewfinder {
      position: absolute; inset: 0;
      display: inline-block;
      pointer-events: none;
    }
    .viewfinder span {
      position: absolute;
      width: 24px; height: 24px;
      border: 0 solid #FF3ECF;
    }
    .vf-tl { top: -16px;    left: -16px;  border-top-width: 6px;    border-left-width: 6px;   border-top-left-radius: 2px; }
    .vf-tr { top: -16px;    right: -16px; border-top-width: 6px;    border-right-width: 6px;  border-top-right-radius: 2px; }
    .vf-bl { bottom: -16px; left: -16px;  border-bottom-width: 6px; border-left-width: 6px;   border-bottom-left-radius: 2px; }
    .vf-br { bottom: -16px; right: -16px; border-bottom-width: 6px; border-right-width: 6px;  border-bottom-right-radius: 2px; }

    /* ── Slider ── */
    .slider-area {
      position: fixed; right: 0; top: 0;
      width: 177px; height: 100vh; z-index: 100;
    }
    .slider-svg {
      position: absolute; left: 81px; top: 0;
      width: 80px; height: 100vh; overflow: visible; pointer-events: none;
    }
    .slider-controls {
      position: absolute; left: 0; top: 96px;
      display: flex; align-items: center; gap: 16px;
      cursor: grab; user-select: none; touch-action: none;
    }
    .slider-controls.is-dragging { cursor: grabbing; }
    .slider-number { height: 44px; overflow: hidden; }
    .num-track { will-change: transform, opacity; }
    .num-track span {
      display: block; height: 44px; line-height: 44px;
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 40px; letter-spacing: -0.4px; color: #000; white-space: nowrap;
    }
    .slider-btn { position: relative; width: 40px; height: 40px; flex-shrink: 0; overflow: visible; }
    .slider-btn-bg { position: absolute; top: -6.62%; right: -16.91%; bottom: -27.21%; left: -16.91%; background: #1a1a1a; border-radius: 50%; width: 100%; height: 100%; }
    .slider-btn-icon { position: absolute; top: 29.26%; right: 42.5%; bottom: 33.24%; left: 42.5%; }
    .slider-btn-icon svg { width: 100%; height: 100%; display: block; }

    /* ── Bottom bar ── */
    .bottom-location {
      position: fixed; bottom: 0; left: 0;
      display: flex; align-items: center; padding: 24px 56px; z-index: 1000;
    }
    .bottom-location p {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 16px; line-height: 1.3; letter-spacing: -0.16px; color: #000; white-space: nowrap;
    }

    /* ── BYOND section ── */
    .byond-text {
      position: absolute; left: 88px; top: 253px;
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 100px; line-height: 1.1; letter-spacing: -1px; color: #000;
    }
    .byond-phone {
      position: absolute; left: 612px; top: 110px;
      width: 338px; height: 679px; will-change: transform; background: transparent;
    }
    .byond-phone img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* ── Placeholder sections ── */
    .ph-layout {
      position: absolute; top: 181px; left: 0; width: 1440px;
      display: flex; align-items: center; gap: 74px; padding: 0 56px;
    }
    .ph-text {
      display: flex; flex-direction: column; gap: 8px;
      width: 480px; padding: 8px 0; flex-shrink: 0;
    }
    .ph-label {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 20px; line-height: 1.3; letter-spacing: -0.2px; color: #000; width: 229px;
    }
    .ph-title {
      font-family: 'ITC Garamond Std', 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-weight: 300;
      font-size: 100px; line-height: 1.1; letter-spacing: -1px; color: #000;
    }
    .ph-image {
      position: relative; width: 418px; height: 437px;
      flex-shrink: 0; will-change: transform;
      display: flex; align-items: flex-end; justify-content: flex-start; padding: 20px 24px;
    }
    .ph-image-label {
      font-family: 'Recoleta', Georgia, serif; font-weight: 300;
      font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    /* ── Pre-GSAP hide (prevents flash before load) ── */
    .byond-text .line,
    .byond-phone,
    .page-placeholder .line,
    .page-placeholder .ph-label,
    .page-placeholder .ph-image { opacity: 0; }
  </style>
</head>
<body>

  <!-- ── Persistent UI ── -->
  <nav class="navbar">

      <img src="assets/images/Am_LOGO.png" alt="Ilham logo" />
    </div>
    <div class="nav-pill">

  <div class="slider-area">
    <svg id="slider-svg" class="slider-svg" width="80" height="100%" xmlns="http://www.w3.org/2000/svg">
      <path id="slider-curve" fill="none" stroke="#8AD103" stroke-width="1" />

    </svg>
    <div class="slider-controls" id="slider-controls">
      <div class="slider-number">
        <div class="num-track" id="num-track"><span>01</span></div>
      </div>
      <div class="slider-btn">

        <div class="slider-btn-icon">
          <svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">

  <div class="edge-fade top"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>

  <script>
    // ── Clock ──────────────────────────────────────────────
    function updateTime() {
      var t = new Intl.DateTimeFormat('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Jakarta'
      }).format(new Date());
      document.getElementById('jakarta-time').textContent = 'based in Jakarta, ' + t + ' WIB';
    }
    updateTime();
    setInterval(updateTime, 1000);

    // ── Character split for hero title ────────────────────
    function splitChars() {
      var sels = [
        '.hero-title .line',
        '.hero-subtitle',
        '.byond-text .line',
        '.ph-label',
        '.ph-title .line'
      ];
      sels.forEach(function(sel) {
        document.querySelectorAll(sel).forEach(function(el) {
          var text = el.textContent;
          el.textContent = '';
          text.split('').forEach(function(ch) {
            var s = document.createElement('span');
            s.className = 'char';
            s.textContent = ch === ' ' ? ' ' : ch;
            el.appendChild(s);
          });
        });
      });
    }
    splitChars();

    // ── Slider SVG ─────────────────────────────────────────
    var SVG_NS       = 'http://www.w3.org/2000/svg';
    var svgCurve     = document.getElementById('slider-curve');
    var ticksG       = document.getElementById('slider-ticks');
    var controlsEl   = document.getElementById('slider-controls');
    var TRACK_H      = window.innerHeight || 900;
    var LINE_REST_X  = 18;
    var TICK_X       = 12;
    var TICK_LEN     = 12;
    var TICK_STEP    = 8;
    var TICK_Y0      = 0.5;
    var TICK_PEAK    = 20;
    var TICK_R       = 44;
    var THUMB_OFFSET = 24;

    var ticks = [];
    for (var i = 0, ty0 = TICK_Y0; ty0 <= TRACK_H; i++, ty0 = TICK_Y0 + i * TICK_STEP) {
      var ln = document.createElementNS(SVG_NS, 'line');
      ln.setAttribute('y1', ty0); ln.setAttribute('y2', ty0);
      var isGreen = (i % 5 === 0 && i !== 0);
      ln.setAttribute('stroke', isGreen ? '#8AD103' : '#CACACA');
      ln.setAttribute('stroke-width', '1');
      ticksG.appendChild(ln);
      ticks.push({ el: ln, y: ty0 });
    }

    function bell(d, R) {
      var ad = Math.abs(d);
      if (ad >= R) return 0;
      return 0.5 * (1 + Math.cos(Math.PI * d / R));
    }

    // Velocity drives a liquid teardrop: the bulge swells and the tail that
    // trails the direction of travel elongates, like surface tension.
    function renderSlider(apexY, vel) {
      var r = LINE_REST_X;
      var speed = Math.min(Math.abs(vel) / 16, 1);      // 0…1 normalised speed
      var BULGE = 1 + speed * 0.65;                      // sideways swell
      var lead  = 1 + speed * 0.30;                      // leading tail (short)
      var trail = 1 + speed * 1.30;                      // trailing tail (long)
      var SUP = vel > 0 ? trail : lead;                  // moving down → top trails
      var SDN = vel > 0 ? lead  : trail;
      var bx = 17.970 * BULGE;
      var up = 39.558 * SUP;
      var dn = 49.243 * SDN;
      var d = [
        'M ' + r + ' 0',
        'L ' + r + ' ' + (apexY - up),
        'C ' + r + ' ' + (apexY - up * 0.6273) + ' ' +
              (r + bx * 0.9176) + ' ' + (apexY - up * 0.3708) + ' ' +
              (r + bx) + ' ' + apexY,
        'C ' + (r + bx * 1.0989) + ' ' + (apexY + dn * 0.3580) + ' ' +
               r + ' '                + (apexY + dn * 0.6402) + ' ' +
               r + ' '                + (apexY + dn),
        'L ' + r + ' ' + TRACK_H
      ].join(' ');
      svgCurve.setAttribute('d', d);
      var tickPeak = TICK_PEAK * (1 + speed * 0.5);
      var tickR    = TICK_R    * (1 + speed * 0.35);
      for (var k = 0; k < ticks.length; k++) {
        var t = ticks[k];
        var shift = tickPeak * bell(t.y - apexY, tickR);
        t.el.setAttribute('x1', TICK_X + shift);
        t.el.setAttribute('x2', TICK_X + TICK_LEN + shift);
      }
    }

    var sliderState = { top: 96 };       // committed section anchor (tweened by go())
    var renderApexY = 96 + THUMB_OFFSET; // the curve's bulge — springs toward the thumb
    var apexVel     = 0;
    var dragOffset  = 0;                  // live drag displacement, springs back to 0
    var dragVel     = 0;
    var dragging    = false;

    var APEX_STIFF = 0.16, APEX_DAMP = 0.66;   // lightly damped → subtle settle
    var DRAG_STIFF = 0.18, DRAG_DAMP = 0.60;   // gentle snap-back

    function animateSlider() {
      // When released, the thumb springs back to its section anchor with a bounce.
      if (!dragging && (dragOffset !== 0 || dragVel !== 0)) {
        dragVel = (dragVel + (0 - dragOffset) * DRAG_STIFF) * DRAG_DAMP;
        dragOffset += dragVel;
        if (Math.abs(dragOffset) < 0.15 && Math.abs(dragVel) < 0.15) { dragOffset = 0; dragVel = 0; }
      }

      var thumbY = sliderState.top + dragOffset;
      if (controlsEl) controlsEl.style.top = thumbY + 'px';

      // Curve apex chases the thumb on a spring → trailing, overshoot, settle.
      var target = thumbY + THUMB_OFFSET;
      apexVel = (apexVel + (target - renderApexY) * APEX_STIFF) * APEX_DAMP;
      renderApexY += apexVel;

      renderSlider(renderApexY, apexVel);
      requestAnimationFrame(animateSlider);
    }
    animateSlider();

    // ── No-GSAP fallback ───────────────────────────────────
    function noGsapFallback() {
      document.body.style.overflow = 'auto';
      var porto = document.querySelector('.porto');
      porto.style.position = 'static';
      porto.style.overflow = 'visible';
      document.querySelectorAll('.page-section').forEach(function(s) {
        s.style.position = 'relative'; s.style.height = '900px';
      });
      document.querySelectorAll('.section-inner').forEach(function(s) {
        s.style.transform = 'none'; s.style.top = '0';
      });
      document.querySelectorAll(
        '.byond-text .line,.byond-phone,.page-placeholder .line,.ph-label,.ph-image'
      ).forEach(function(el) { el.style.opacity = '1'; el.style.transform = 'none'; });
    }

    // ── Main ───────────────────────────────────────────────
    window.addEventListener('load', function () {
      if (!window.gsap || !window.Observer) { noGsapFallback(); return; }
      gsap.registerPlugin(Observer);

      var VH       = window.innerHeight;
      var TOTAL    = 6;
      var current  = 0;
      var animating = false;

      // Evenly distribute thumb positions from 96 → VH-200
      function thumbY(i) {
        return 96 + i * (Math.min(VH, 1000) - 296) / (TOTAL - 1);
      }

      // ── Initial hidden states ──
      gsap.set('.byond-phone',      { y: 160, scale: 0.9, opacity: 0 });
      gsap.set('.byond-text .char', { yPercent: 120, opacity: 0 });
      gsap.set('.image-block',      { transformOrigin: '50% 50%' });

      var placeholders = document.querySelectorAll('.page-placeholder');
      placeholders.forEach(function(ph) {
        gsap.set(ph.querySelectorAll('.ph-label, .ph-title .line'), { opacity: 1 });
        gsap.set(ph.querySelectorAll('.ph-label .char, .ph-title .char'), { opacity: 0, yPercent: 110 });
        gsap.set(ph.querySelector('.ph-image'), { opacity: 0, y: 60, scale: 0.95 });
      });

      // Sync slider to section 0
      sliderState.top = thumbY(0);
      renderApexY = thumbY(0) + THUMB_OFFSET;

      // ── Per-section exit / enter ───────────────────────
      function heroExit(tl, at, up) {
        var d = up ? -1 : 1;
        tl.to('.hero-title .char',    { yPercent: 45*d, opacity: 0, duration: 0.45, ease: 'power3.in', stagger: { each: 0.012, ease: 'power1.in', from: 'end' } }, at)
          .to('.hero-subtitle .char', { yPercent: 45*d, opacity: 0, duration: 0.4, ease: 'power3.in', stagger: { each: 0.01, ease: 'power1.in', from: 'end' } }, at)
          .to('.image-block',         { y: 280*d, opacity: 0, duration: 0.5, ease: 'expo.in' }, at)
          .to('.image-mask',          { opacity: 1, duration: 0.55, ease: 'power2.in' }, at);
      }
      function heroEnter(tl, at, fromBelow) {
        var d = fromBelow ? 1 : -1;
        gsap.set('.hero-title .char',    { yPercent: 55*d, opacity: 0 });
        gsap.set('.hero-subtitle .char', { yPercent: 55*d, opacity: 0 });
        gsap.set('.image-block',         { y: 80*d, opacity: 0 });
        gsap.set('.image-mask',          { opacity: 0 });
        tl.to('.image-block',         { y: 0, opacity: 1, duration: 0.9, ease: 'expo.out' }, at)
          .to('.hero-title .char',    { yPercent: 0, opacity: 1, duration: 0.85, ease: 'power3.out', stagger: { each: 0.028, ease: 'power1.inOut' } }, at + 0.08)
          .to('.hero-subtitle .char', { yPercent: 0, opacity: 1, duration: 0.7, ease: 'power3.out', stagger: { each: 0.022, ease: 'power1.inOut' } }, at + 0.18);
      }

      function byondExit(tl, at, up) {
        var d = up ? -1 : 1;
        tl.to('.byond-phone',      { y: 160*d, scale: 0.9, opacity: 0, duration: 0.65, ease: 'expo.in' }, at)
          .to('.byond-text .char', { yPercent: 110*d, opacity: 0, duration: 0.45, ease: 'power3.in', stagger: { each: 0.01, ease: 'power1.in', from: 'end' } }, at);
      }
      function byondEnter(tl, at, fromBelow) {
        var d = fromBelow ? 1 : -1;
        gsap.set('.byond-phone',      { y: 160*d, scale: 0.9, opacity: 0 });
        gsap.set('.byond-text .line', { opacity: 1 });
        gsap.set('.byond-text .char', { yPercent: 110*d, opacity: 0 });
        tl.to('.byond-phone',      { y: 0, scale: 1, opacity: 1, duration: 0.95, ease: 'expo.out' }, at + 0.15)
          .to('.byond-text .char', { yPercent: 0, opacity: 1, duration: 0.85, ease: 'power3.out', stagger: { each: 0.018, ease: 'power1.inOut' } }, at + 0.3);
      }

      function phExit(ph, tl, at, up) {
        var d = up ? -1 : 1;
        tl.to(ph.querySelectorAll('.ph-label .char, .ph-title .char'),
              { yPercent: 110*d, opacity: 0, duration: 0.4, ease: 'power3.in', stagger: { each: 0.01, ease: 'power1.in', from: 'end' } }, at)
          .to(ph.querySelector('.ph-image'),
              { y: 60*d, scale: 0.88, opacity: 0, duration: 0.55, ease: 'expo.in' }, at);
      }
      function phEnter(ph, tl, at, fromBelow) {
        var d = fromBelow ? 1 : -1;
        gsap.set(ph.querySelectorAll('.ph-label, .ph-title .line'),      { opacity: 1 });
        gsap.set(ph.querySelectorAll('.ph-label .char, .ph-title .char'), { yPercent: 110*d, opacity: 0 });
        gsap.set(ph.querySelector('.ph-image'),                           { y: 60*d, scale: 0.95, opacity: 0 });
        tl.to(ph.querySelector('.ph-image'),
              { y: 0, scale: 1, opacity: 1, duration: 0.85, ease: 'expo.out' }, at)
          .to(ph.querySelectorAll('.ph-label .char, .ph-title .char'),
              { yPercent: 0, opacity: 1, duration: 0.7, ease: 'power3.out', stagger: { each: 0.018, ease: 'power1.inOut' } }, at + 0.1);
      }

      function doExit(idx, tl, at, forward) {
        if (idx === 0)      heroExit(tl, at, forward);
        else if (idx === 1) byondExit(tl, at, forward);
        else                phExit(placeholders[idx - 2], tl, at, forward);
      }
      function doEnter(idx, tl, at, forward) {
        if (idx === 0)      heroEnter(tl, at, forward);
        else if (idx === 1) byondEnter(tl, at, forward);
        else                phEnter(placeholders[idx - 2], tl, at, forward);
      }

      // ── Navigation ────────────────────────────────────
      function go(dir) {
        if (animating) return;
        animating = true;
        var prev    = current;
        current     = (current + dir + TOTAL) % TOTAL;
        var forward = dir > 0;

        var tl = gsap.timeline({ onComplete: function () { animating = false; syncClickable(); } });
        doExit(prev, tl, 0, forward);
        doEnter(current, tl, 0.55, forward);

        // Slider thumb glides to the new section with an elastic overshoot;
        // animateSlider() reads sliderState.top each frame and the curve
        // springs along behind it. (Curve/thumb position now live in the rAF loop.)
        tl.to(sliderState, { top: thumbY(current), duration: 0.7, ease: 'back.out(1.1)' }, 0);

        // Number counter fade-swap
        var numStr   = String(current + 1).padStart(2, '0');
        var numTrack = document.getElementById('num-track');
        tl.to(numTrack, {
              opacity: 0, y: forward ? -8 : 8, duration: 0.15, ease: 'power2.in',
              onComplete: function () {
                numTrack.querySelector('span').textContent = numStr;
                gsap.set(numTrack, { y: forward ? 8 : -8 });
              }
            }, 0.1)
          .to(numTrack, { opacity: 1, y: 0, duration: 0.2, ease: 'power2.out' }, 0.3);
      }

      Observer.create({
        type: 'wheel,touch',
        onDown: function () { go(1);  },
        onUp:   function () { go(-1); },
        tolerance: 10,
        preventDefault: true
      });

      window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { go(1);  e.preventDefault(); }
        else if (e.key === 'ArrowUp' || e.key === 'PageUp')                 { go(-1); e.preventDefault(); }
      });

      // ── Draggable thumb — same destination as scroll ───
      // Pull the thumb and the curve stretches elastically after it; release
      // past the trigger to commit a section change, otherwise it snaps back.
      var dragStartY = null, dragRaw = 0;
      var DRAG_STEP  = 52;   // drag distance that advances one point
      var DRAG_LIMIT = 60;   // elastic ceiling between points

      // Asymptotic rubber-band: thumb follows the finger but resists past a point.
      function rubber(d) {
        var s = d < 0 ? -1 : 1, ad = Math.abs(d);
        return s * DRAG_LIMIT * (1 - 1 / (ad / DRAG_LIMIT * 0.7 + 1));
      }

      controlsEl.addEventListener('pointerdown', function (e) {
        dragStartY = e.clientY;
        dragRaw = 0;
        dragging = true;
        dragVel = 0;
        controlsEl.classList.add('is-dragging');
        controlsEl.setPointerCapture(e.pointerId);
      });
      controlsEl.addEventListener('pointermove', function (e) {
        if (dragStartY === null) return;
        dragRaw = e.clientY - dragStartY;
        dragOffset = rubber(dragRaw);     // elastic pull toward the next point

        // Ratchet point-by-point: each full step snaps to the next section
        // anchor, then re-baselines so the next step advances again.
        if (!animating) {
          if (dragRaw >= DRAG_STEP)       { go(1);  dragStartY = e.clientY; dragRaw = 0; dragOffset = 0; }
          else if (dragRaw <= -DRAG_STEP) { go(-1); dragStartY = e.clientY; dragRaw = 0; dragOffset = 0; }
        }
      });
      function endDrag() {
        if (dragStartY === null) return;
        dragStartY = null;
        dragging = false;                 // dragOffset springs back to the point
        controlsEl.classList.remove('is-dragging');
      }
      controlsEl.addEventListener('pointerup',     endDrag);
      controlsEl.addEventListener('pointercancel', endDrag);

      // ── Image click → case study ───────────────────────
      // page-section has pointer-events:none (CSS), so only the element we
      // explicitly mark 'auto' can receive clicks — preventing the topmost
      // stacked section from swallowing events meant for the active one.
      var imgEls = [
        document.querySelector('.image-block'),
        document.querySelector('.byond-phone')
      ];
      placeholders.forEach(function(ph) {
        imgEls.push(ph ? ph.querySelector('.ph-image') : null);
      });

      var syncClickable = function() {
        imgEls.forEach(function(el, idx) {
          if (!el) return;
          var on = (idx === current);
          el.style.pointerEvents = on ? 'auto' : 'none';
          el.style.cursor        = on ? 'pointer' : 'default';
        });
      };
      syncClickable();

      imgEls.forEach(function(el, idx) {
        if (!el) return;
        el.addEventListener('click', function() {
          if (animating) return;
          gsap.to('.porto', {
            opacity: 0, duration: 0.35, ease: 'power2.in',
            onComplete: function() {
              window.location.href = 'case-study.html?p=' + (idx + 1);
            }
          });
        });
      });

      // Page fade-in on entry
      gsap.from('.porto', { opacity: 0, duration: 0.45, ease: 'power2.out' });
    });
  </script>
</body>
</html>
